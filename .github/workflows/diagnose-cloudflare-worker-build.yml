name: Diagnose Cloudflare Worker Build

on:
  workflow_dispatch:
    inputs:
      build_uuid:
        description: "UUID from the failed Cloudflare Workers Build details URL"
        required: true
        type: string
      worker_tag:
        description: "Worker tag (32 hexadecimal characters) for a Worker to inspect"
        required: true
        type: string
      confirm_read_only_diagnosis:
        description: "Required: confirm read-only Cloudflare diagnostics from trusted main"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: diagnose-cloudflare-build-${{ inputs.build_uuid }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && inputs.confirm_read_only_diagnosis == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate input and token
        shell: bash
        env:
          BUILD_UUID: ${{ inputs.build_uuid }}
          WORKER_TAG: ${{ inputs.worker_tag }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_UUID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::build_uuid must be a valid UUID."
            exit 1
          fi
          if [[ ! "$WORKER_TAG" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::worker_tag must be 32 hexadecimal characters."
            exit 1
          fi
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_WORKERS_BUILDS_API_TOKEN."
            exit 1
          fi
          echo "::add-mask::$CF_API_TOKEN"

      - name: Fetch build record, token status, Worker mapping, trigger and logs (read-only)
        shell: bash
        env:
          BUILD_UUID: ${{ inputs.build_uuid }}
          WORKER_TAG: ${{ inputs.worker_tag }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id="92cf091bbac8b4879ec65feb30b4715b"
          api="https://api.cloudflare.com/client/v4/accounts/${account_id}/builds"
          worker_api="https://api.cloudflare.com/client/v4/accounts/${account_id}/workers/scripts"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_json() {
            local url="$1"
            local out="$2"
            local status
            status="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header 'Accept: application/json' "$url")"
            if [[ "$status" -lt 200 || "$status" -ge 300 ]] || ! jq -e '.success == true' "$out" >/dev/null; then
              echo "::error::Cloudflare API request failed (HTTP $status)."
              jq -r '(.errors[]?.message // empty), (.messages[]? // empty)' "$out" 2>/dev/null || true
              echo "Use a user-scoped token with Workers CI: Read/Write, Workers Builds Configuration: Read/Edit, and Workers Scripts: Read permissions as needed."
              exit 1
            fi
          }

          fetch_json "${api}/builds/${BUILD_UUID}" "$tmp/build.json"
          fetch_json "${api}/tokens" "$tmp/tokens.json"
          echo "## Build metadata"
          jq -r '
            "Build UUID: " + (.result.build_uuid // "unknown"),
            "Outcome: " + (.result.build_outcome // "unknown"),
            "Preview URL: " + (.result.preview_url // "not available"),
            "Unique Deployment URL: " + (.result.deployment_url // .result.version_url // "not available"),
            "Build result fields: " + ((.result // {}) | keys | join(", ")),
            "Recorded trigger tag: " + (.result.trigger.external_script_id // .result.trigger_metadata.external_script_id // "not included"),
            "Recorded trigger name: " + (.result.trigger.trigger_name // .result.trigger_metadata.trigger_name // "not included"),
            "Recorded trigger UUID: " + (.result.trigger.trigger_uuid // .result.trigger_metadata.trigger_uuid // "not included"),
            "Recorded trigger deploy command: " + (.result.trigger.deploy_command // .result.trigger_metadata.deploy_command // "not included"),
            "Branch: " + (.result.build_trigger_metadata.branch // "unknown"),
            "Commit: " + (.result.build_trigger_metadata.commit_hash // "unknown"),
            "Build command: " + (.result.build_trigger_metadata.build_command // "unknown"),
            "Deploy command: " + (.result.build_trigger_metadata.deploy_command // "unknown"),
            "Recorded build token name: " + (.result.build_trigger_metadata.build_token_name // "unknown"),
            "Recorded build token UUID present: " + (if ((.result.build_trigger_metadata.build_token_uuid // "") | length) > 0 then "yes" else "no" end),
            "Trigger metadata keys: " + ((.result.build_trigger_metadata // {}) | keys | join(", ")),
            "Created: " + (.result.created_on // .result.created_at // "unknown"),
            "Updated: " + (.result.modified_on // .result.updated_at // "unknown")
          ' "$tmp/build.json"

          historical_token_uuid="$(jq -r '.result.build_trigger_metadata.build_token_uuid // empty' "$tmp/build.json")"
          if [[ -z "$historical_token_uuid" ]]; then
            echo "Historical build token status: UUID not present in build metadata."
          elif jq -e --arg uuid "$historical_token_uuid" '[.result[]? | select(.build_token_uuid == $uuid)] | length > 0' "$tmp/tokens.json" >/dev/null; then
            echo "Historical build token status: matching record exists in the current token list."
          else
            echo "::warning::Historical build token status: no matching record in the current token list (possible removed or rotated token)."
          fi

          fetch_json "$worker_api" "$tmp/workers.json"
          echo
          echo "## Cloudflare Worker name-to-tag mapping"
          jq -r '.result[] | select(.id == "ai-thuc-chien-blog" or .id == "ai-thuc-chien-blog-moi") | "Worker name: " + .id + " | tag: " + (.tag // "unknown")' "$tmp/workers.json"

          echo
          echo "## Association of this build UUID with each Worker's build history"
          while IFS=$'\t' read -r worker_name worker_tag; do
            [[ -n "$worker_name" && -n "$worker_tag" ]] || continue
            fetch_json "${api}/workers/${worker_tag}/builds" "$tmp/history.json"
            if jq -e --arg uuid "$BUILD_UUID" '[.result[]? | select(.build_uuid == $uuid)] | length > 0' "$tmp/history.json" >/dev/null; then
              echo "Build UUID is listed under Worker: $worker_name"
            else
              echo "Build UUID is not listed under Worker: $worker_name"
            fi
          done < <(jq -r '.result[]? | select(.id == "ai-thuc-chien-blog" or .id == "ai-thuc-chien-blog-moi") | [.id, .tag] | @tsv' "$tmp/workers.json")

          fetch_json "${api}/workers/${WORKER_TAG}/triggers" "$tmp/triggers.json"
          echo
          echo "## Matching trigger configuration (secret values are not printed)"
          jq -r --arg tag "$WORKER_TAG" '
            [.result[] | select(.external_script_id == $tag)] as $matches |
            if ($matches | length) == 0 then
              "No trigger matched the supplied worker tag."
            else
              $matches[] |
              "Worker tag: " + (.external_script_id // "unknown"),
              "Trigger UUID: " + (.trigger_uuid // "unknown"),
              "Trigger name: " + (.trigger_name // "unknown"),
              "Branches included: " + ((.branch_includes // []) | join(", ")),
              "Branches excluded: " + ((.branch_excludes // []) | join(", ")),
              "Build command: " + (.build_command // "unknown"),
              "Deploy command: " + (.deploy_command // "unknown"),
              "Build token name: " + (.build_token_name // "unknown"),
              "Build token UUID present: " + (if ((.build_token_uuid // "") | length) > 0 then "yes" else "no" end),
              "Root directory: " + (.root_directory // "unknown"),
              "Repository: " + ((.repo_connection.repo_name // "unknown") + " / " + ((.repo_connection.repo_id // "unknown") | tostring)),
              "Environment variable names: " + ((.environment_variables // {} | keys) | join(", "))
            end
          ' "$tmp/triggers.json"

          trigger_token_uuid="$(jq -r --arg tag "$WORKER_TAG" '[.result[]? | select(.external_script_id == $tag)][0].build_token_uuid // empty' "$tmp/triggers.json")"
          if [[ -z "$trigger_token_uuid" ]]; then
            echo "Current trigger build token status: UUID not present in trigger configuration."
          elif jq -e --arg uuid "$trigger_token_uuid" '[.result[]? | select(.build_token_uuid == $uuid)] | length > 0' "$tmp/tokens.json" >/dev/null; then
            trigger_token_name="$(jq -r --arg uuid "$trigger_token_uuid" '[.result[]? | select(.build_token_uuid == $uuid)][0].build_token_name // "unnamed"' "$tmp/tokens.json")"
            echo "Current trigger build token status: matching record exists (name: $trigger_token_name)."
          else
            echo "::warning::Current trigger build token status: no matching record in the current token list (possible removed or rotated token)."
          fi

          echo
          echo "## Build log (read-only; latest 300 lines)"
          cursor=""
          page=1
          while [[ "$page" -le 6 ]]; do
            url="${api}/builds/${BUILD_UUID}/logs"
            if [[ -n "$cursor" ]]; then
              encoded_cursor="$(printf '%s' "$cursor" | jq -sRr @uri)"
              url="${url}?cursor=${encoded_cursor}"
            fi
            fetch_json "$url" "$tmp/logs.json"
            jq -r '.result.lines[]? | if type == "array" then map(tostring) | join(" ") else tostring end' "$tmp/logs.json" | tail -n 300
            cursor="$(jq -r '.result.cursor // empty' "$tmp/logs.json")"
            [[ -z "$cursor" ]] && break
            page=$((page + 1))
          done
          if [[ -n "$cursor" ]]; then
            echo "Additional log pages remain; rerun or inspect build history in the Cloudflare dashboard."
          fi
