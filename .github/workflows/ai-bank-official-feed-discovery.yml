name: AI Bank official-feed discovery

on:
  pull_request:
    paths:
      - "scripts/ai-bank-feed-discovery.mjs"
      - ".github/workflows/ai-bank-official-feed-discovery.yml"
  schedule:
    # Wednesday 09:30 Asia/Ho_Chi_Minh
    - cron: "30 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-bank-official-feed-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check JavaScript syntax on pull requests
        if: github.event_name == 'pull_request'
        run: node --check scripts/ai-bank-feed-discovery.mjs

      - name: Collect discovery leads from official feeds
        if: github.event_name != 'pull_request'
        run: node scripts/ai-bank-feed-discovery.mjs

      - name: Add report to workflow summary
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f reports/ai-bank/discovery.md ]; then
            cat reports/ai-bank/discovery.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Discovery report was not generated. Inspect the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve discovery report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-bank-discovery-${{ github.run_id }}
          path: reports/ai-bank/
          if-no-files-found: warn
          retention-days: 30
