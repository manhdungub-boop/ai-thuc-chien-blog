name: Deploy Cloudflare Pages

# Production Pages deployment requires an explicit manual dispatch from main.
on:
  workflow_dispatch:
    inputs:
      confirm_production_pages_deploy:
        description: "Required: explicitly approve deploying the reviewed main branch to Production Pages."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    # A dispatch from any feature/PR branch must never publish to the production Pages branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_pages_deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static site files
        run: npm run build

      - name: Check for dedicated Pages deployment token
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          if [[ -z "$CF_PAGES_TOKEN" ]]; then
            echo "::error::Pages deploy stopped: add CLOUDFLARE_PAGES_API_TOKEN as a repository Actions secret with Cloudflare Pages Edit permission. Do not paste the token into source code or chat."
            exit 1
          fi
          echo "Dedicated Pages deployment token is configured."

      - name: Normalize Pages token for Wrangler
        id: normalized_token
        shell: bash
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CF_PAGES_TOKEN" | tr -d '[:space:]')"
          if [[ -z "$token" ]]; then
            echo "::error::Cloudflare Pages token is empty after removing whitespace. Recreate the repository secret using only the token value."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1 (GitHub-verified commit)
        with:
          apiToken: ${{ steps.normalized_token.outputs.token }}
          accountId: 92cf091bbac8b4879ec65feb30b4715b
          wranglerVersion: "4.151.3"
          command: pages deploy dist --project-name=ai-thuc-chien-blog --branch=main
