name: CodeQL Action Pinning Review

on:
  push:
    branches:
      - security/pin-third-party-actions-20261110
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: read

concurrency:
  group: codeql-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4.39.3
        with:
          languages: actions
          queries: security-extended

      - name: Analyze workflows without uploading SARIF
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4.39.3
        with:
          category: /language:actions
          output: ${{ github.workspace }}/codeql-results
          upload: never
          wait-for-processing: false

      - name: Summarize local SARIF findings
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          from collections import Counter

          files = glob.glob("codeql-results/**/*.sarif", recursive=True)
          if not files:
              raise SystemExit("No SARIF output found; CodeQL result count cannot be verified")
          results = []
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  sarif = json.load(handle)
              for run in sarif.get("runs", []):
                  rules = {
                      item.get("id"): item
                      for item in run.get("tool", {}).get("driver", {}).get("rules", [])
                  }
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "unknown")
                      rule = rules.get(rule_id, {})
                      locations = result.get("locations", [])
                      for location in locations:
                          physical = location.get("physicalLocation", {})
                          artifact = physical.get("artifactLocation", {}).get("uri", "unknown")
                          region = physical.get("region", {})
                          line = region.get("startLine", "?")
                          results.append({
                              "rule": rule_id,
                              "level": result.get("level", "unspecified"),
                              "security_severity": rule.get("properties", {}).get("security-severity", "unknown"),
                              "file": artifact,
                              "line": line,
                          })
          print(f"## CodeQL findings: {len(results)}")
          for rule, count in sorted(Counter(item["rule"] for item in results).items()):
              print(f"- {rule}: {count}")
          for item in results:
              print(f"- {item['rule']} | level={item['level']} | severity={item['security_severity']} | {item['file']}:{item['line']}")
          PY
