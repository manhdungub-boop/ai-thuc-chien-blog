      - name: Verify Workers Free plan before deployment
        timeout-minutes: 2
        env:
          CLOUDFLARE_BILLING_READ_API_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_BILLING_READ_API_TOKEN:-}" ]]; then
            echo "::error::Preview deployment credential is unavailable; no deployment attempted."
            exit 1
          fi
          response="$RUNNER_TEMP/cloudflare-subscriptions.json"
          status="$(curl --silent --show-error --max-time 15 --output "$response" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_BILLING_READ_API_TOKEN" \
            --header "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Workers plan could not be verified (HTTP $status); stopped before deployment."
            exit 1
          fi
          # Cloudflare documents Workers Free as the default plan. A successful subscription-list response with no paid Workers subscription therefore means Workers Free.
          plan_check="$(PLAN_RESPONSE="$response" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          function classifyCloudflareWorkersPlan(payload) {
            if (!payload || typeof payload !== 'object' || Array.isArray(payload) ||
                payload.success !== true || !Array.isArray(payload.result)) return 'invalid';

            const info = payload.result_info;
            if (!info || typeof info !== 'object' || Array.isArray(info) ||
                !Number.isSafeInteger(info.page) || info.page !== 1 ||
                !Number.isSafeInteger(info.per_page) || info.per_page < 1 ||
                info.per_page < payload.result.length) return 'incomplete';

            const completeByTotalCount =
              info.next_page === undefined &&
              Number.isSafeInteger(info.count) && info.count === payload.result.length &&
              Number.isSafeInteger(info.total_count) && info.total_count === payload.result.length;
            const completeByNextPage =
              info.next_page === false &&
              (info.count === undefined || (Number.isSafeInteger(info.count) && info.count === payload.result.length)) &&
              (info.total_count === undefined || (Number.isSafeInteger(info.total_count) && info.total_count === payload.result.length));
            if (!completeByTotalCount && !completeByNextPage) return 'incomplete';

            if (payload.result.length === 0) return 'free-default';

            const allActiveSubscriptionsExplicitlyFree = payload.result.every(subscription => {
              if (!subscription || typeof subscription !== 'object' || Array.isArray(subscription)) return false;
              const state = subscription.state;
              if (!['Trial', 'Provisioned', 'Paid', 'AwaitingPayment', 'Cancelled', 'Failed', 'Expired'].includes(state)) return false;
              if (['Cancelled', 'Failed', 'Expired'].includes(state)) return true;
              if (typeof subscription.price !== 'number' || subscription.price !== 0) return false;
              const plan = subscription.rate_plan;
              if (!plan || typeof plan !== 'object' || Array.isArray(plan)) return false;
              const label = [plan.id, plan.public_name, plan.name]
                .filter(value => typeof value === 'string')
                .join(' ')
                .toLowerCase();
              return /(^|[^a-z0-9])free([^a-z0-9]|$)/.test(label);
            });
            return allActiveSubscriptionsExplicitlyFree ? 'free' : 'non-free';
          }

          const completeInfo = count => ({ page: 1, per_page: 20, count, total_count: count });
          assert.equal(classifyCloudflareWorkersPlan({
            success: true, result: [], result_info: completeInfo(0)
          }), 'free-default');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true,
            result: [{ state: 'Paid', price: 0, rate_plan: { id: 'free', public_name: 'Free' } }],
            result_info: completeInfo(1)
          }), 'free');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true,
            result: [{ state: 'Paid', price: 5, rate_plan: { id: 'workers-paid', public_name: 'Workers Paid' } }],
            result_info: completeInfo(1)
          }), 'non-free');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true,
            result: [{ state: 'Paid', price: 20, rate_plan: { id: 'pro', public_name: 'Pro' } }],
            result_info: completeInfo(1)
          }), 'non-free', 'any active paid subscription blocks the Free-only deployment gate');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true, result: [], result_info: { page: 1, per_page: 25, next_page: false }
          }), 'free-default', 'explicit next_page=false proves complete enumeration when total_count is omitted');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true, result: [], result_info: { page: 1, per_page: 25, next_page: true }
          }), 'incomplete', 'a remaining page must fail closed');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true, result: [], result_info: { page: 1, per_page: 25, count: 0, total_count: 0, next_page: true }
          }), 'incomplete', 'explicit next_page=true must override matching totals');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true, result: [], result_info: { page: 1, per_page: 25, count: 0, total_count: 0, next_page: 'false' }
          }), 'incomplete', 'malformed next_page metadata must fail closed');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true, result: [], result_info: { page: 1, per_page: 20, count: 0 }
          }), 'incomplete', 'missing completeness metadata must fail closed');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true,
            result: [{ state: 'Paid', price: 0, rate_plan: { id: 'free', public_name: 'Free' } }],
            result_info: { page: 1, per_page: 20, count: 1, total_count: 2 }
          }), 'incomplete', 'truncated subscription pages must fail closed');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true, result: [], result_info: { page: 2, per_page: 20, count: 0, total_count: 0 }
          }), 'incomplete', 'unexpected page must fail closed');
          assert.equal(classifyCloudflareWorkersPlan({
            success: true,
            result: [{ state: 'Paid', rate_plan: { id: 'free', public_name: 'Free' } }],
            result_info: completeInfo(1)
          }), 'non-free', 'missing price must not be treated as zero-cost');
          assert.equal(classifyCloudflareWorkersPlan({ success: true, result: {} }), 'invalid');

          const payload = JSON.parse(await readFile(process.env.PLAN_RESPONSE, 'utf8'));
          const classification = classifyCloudflareWorkersPlan(payload);
          if (!['free', 'free-default'].includes(classification)) {
            throw new Error('Workers plan is not proven Free (' + classification + '); stopped before deployment.');
          }
          console.log(classification);
          NODE
          )"
          case "$plan_check" in
            free|free-default)
              echo "Workers Free plan verified from a complete subscription listing; every active subscription is explicitly Free and zero-price."
              ;;
            *) echo "::error::Workers plan is not proven Free; deployment stopped."; exit 1 ;;
          esac

      - name: Deploy the one-shot read-only E2E configuration to dedicated Preview
        timeout-minutes: 3
        id: deploy_e2e
        working-directory: agents/runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
