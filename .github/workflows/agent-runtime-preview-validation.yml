          await writeFile(process.env.GENERATED_CONFIG, JSON.stringify(config, null, 2) + '\n', { mode: 0o600 });
          NODE
          timeout --signal=TERM --kill-after=10s 120s npx --yes wrangler@4.166.0 deploy --config "$generated_config" \
            --message "One-shot OIDC read-only E2E; automatic disable/restore follows"

      - name: Wait for the expected enabled Preview configuration before invoking the task
        timeout-minutes: 1
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --max-time 5 "$AGENT_RUNTIME_PREVIEW_URL/health" -o "$RUNNER_TEMP/preview-health.json" 2>/dev/null &&
              node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const h = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/preview-health.json', 'utf8'));
          assert.equal(h.ok, true);
          assert.equal(h.service, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(h.enabled, true);
          assert.equal(h.paused, false);
          assert.equal(h.scheduler, 'manual_only_no_cron');
          assert.equal(h.reviewer_auth_enabled, false);
          assert.equal(h.publication_authorized, false);
          NODE
            then
              ready=true
              break
            fi
            echo "The expected enabled Preview version is not serving yet (attempt $attempt/8)."
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::The expected enabled Preview configuration did not become healthy; refusing to invoke the task."
            exit 1
          fi

      - name: Probe OIDC run gate readiness before requesting the token
        timeout-minutes: 1
        env:
          AGENT_RUNTIME_PREVIEW_URL: ${{ env.AGENT_RUNTIME_PREVIEW_URL }}
        run: |
          set -euo pipefail
          probe_body='{"task":{"type":"content.review","idempotencyKey":"oidc-preview-e2e:readiness-probe","payload":{"articlePath":"articles/ai-agent-thuc-hanh-tu-thiet-ke-den-kiem-soat.html"}}}'
          ready=false
          ready_streak=0
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --max-time 8 --output "$RUNNER_TEMP/oidc-readiness.json" --write-out "%{http_code}" \
              --request POST "$AGENT_RUNTIME_PREVIEW_URL/internal/oidc/run" \
              --header "Content-Type: application/json" \
              --header "Accept: application/json" \
              --data "$probe_body")"
            if [[ "$status" == "401" ]] && jq -e '.error == "github_oidc_token_required"' "$RUNNER_TEMP/oidc-readiness.json" >/dev/null; then
              ready_streak=$((ready_streak + 1))
              echo "OIDC run gate readiness probe passed ($ready_streak/3 consecutive checks)."
              if [[ "$ready_streak" -ge 3 ]]; then
                ready=true
                break
              fi
              sleep 1
              continue
            fi
            ready_streak=0
            if [[ "$status" != "503" ]]; then
              echo "::error::OIDC readiness probe returned an unexpected HTTP $status; refusing to request an operator token."
              cat "$RUNNER_TEMP/oidc-readiness.json"
