name: Deploy Cloudflare Workers

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare static site files
        run: |
          mkdir -p dist/articles
          cp index.html ve-chung-toi.html feed.xml styles.css script.js robots.txt sitemap.xml favicon.svg 404.html dist/
          cp articles/*.html dist/articles/
          test -f dist/articles/workflow-ai-airtable-activepieces.html

      - name: Check the dedicated Worker token
        env:
          CF_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          if [ -z "$CF_WORKERS_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_WORKERS_API_TOKEN. Create a scoped Cloudflare Workers Editor/Workers Scripts Write token for the existing ai-thuc-chien-blog Worker, then add it in GitHub repository Settings > Secrets and variables > Actions. Do not paste the token into source code or chat."
            exit 1
          fi

      - name: Deploy to the existing production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: 92cf091bbac8b4879ec65feb30b4715b
          command: deploy --config wrangler.jsonc
