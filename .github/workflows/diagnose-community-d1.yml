name: Diagnose Community D1 Schema
on:
  workflow_dispatch:
    inputs:
      confirm_read_only_diagnosis:
        description: "Required: confirm read-only Production/Preview schema inspection from trusted main"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: community-d1-schema-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && inputs.confirm_read_only_diagnosis == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed main source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify production and preview community table schema (read-only)
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 92cf091bbac8b4879ec65feb30b4715b
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_WORKERS_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_WORKERS_API_TOKEN is not configured."
            exit 2
          fi
          echo "::add-mask::$CLOUDFLARE_WORKERS_API_TOKEN"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.CLOUDFLARE_WORKERS_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const prod = (config.d1_databases || []).find(x => x.binding === 'DB');
          const preview = ((config.previews || {}).d1_databases || []).find(x => x.binding === 'DB');
          if (!prod || !preview || prod.database_id === preview.database_id) {
            throw new Error('Missing DB binding or preview DB aliases production.');
          }
          const required = {
            community_members: ['id','username','email','display_name','password_salt','password_hash','created_at'],
            community_sessions: ['id','member_id','token_hash','created_at','expires_at'],
            community_messages: ['id','topic','member_id','body','created_at'],
            community_rate_limits: ['bucket','count','window_start'],
          };
          const sql = "SELECT name, sql FROM sqlite_master WHERE type='table' AND substr(name,1,10)='community_' ORDER BY name";
          let failed = false;
          for (const [label, db] of [['production', prod], ['preview', preview]]) {
            const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db.database_id}/query`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ sql }),
            });
            let body;
            try { body = await res.json(); } catch { throw new Error(`${label}: invalid Cloudflare API response (HTTP ${res.status})`); }
            if (!res.ok || body.success !== true) {
              const codes = (body.errors || []).map(e => e.code).filter(Boolean).join(', ');
              throw new Error(`${label}: read-only schema query failed (HTTP ${res.status}${codes ? `, code ${codes}` : ''}); check token D1 permissions`);
            }
            const resultSets = Array.isArray(body.result) ? body.result : [body.result];
            const rows = resultSets.flatMap(x => Array.isArray(x?.results) ? x.results : []);
            const schema = new Map(rows.map(x => [String(x.name), String(x.sql || '')]));
            console.log(`\n=== ${label.toUpperCase()} D1: ${db.database_name} (${db.database_id}) ===`);
            console.log('COMMUNITY_TABLES:', [...schema.keys()].sort().join(', ') || '(none)');
            const missing = [];
            const missingColumns = [];
            for (const [table, columns] of Object.entries(required)) {
              const definition = schema.get(table);
              if (!definition) { missing.push(table); continue; }
              const absent = columns.filter(col => !new RegExp(`\\b${col}\\b`, 'i').test(definition));
              if (absent.length) missingColumns.push(`${table}: ${absent.join(', ')}`);
            }
            console.log('MISSING_TABLES:', missing.join(', ') || '(none)');
            console.log('MISSING_COLUMNS:', missingColumns.join('; ') || '(none)');
            if (missing.length || missingColumns.length) failed = true;
          }
          if (failed) {
            console.error('\nCOMMUNITY_D1_SCHEMA_FAILURE: at least one configured database lacks a table/column used by the app.');
            process.exitCode = 1;
          } else {
            console.log('\nPASS: production and preview community schemas contain all tables and columns required by registration.');
          }
          NODE
