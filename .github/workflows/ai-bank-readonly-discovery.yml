name: AI Bank read-only discovery

on:
  schedule:
    # 09:30 Asia/Ho_Chi_Minh every Wednesday
    - cron: "30 2 * * 3"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Discovery window (1-90 days)"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: ai-bank-readonly-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Collect official release discovery signals
        env:
          AI_BANK_DISCOVERY_DAYS: ${{ inputs.lookback_days || '30' }}
        run: node scripts/discover-ai-bank-signals.mjs

      - name: Add safe interpretation to workflow summary
        if: always()
        run: |
          {
            echo "## AI Bank discovery — read only"
            echo
            echo "- Revision: `$GITHUB_SHA`"
            echo "- The collector reads a fixed allowlist of public GitHub Atom release feeds."
            echo "- Signals are candidates for editorial investigation, not verified new products."
            echo "- No catalog, public content, Worker, DNS, D1, secrets, or production setting is modified."
            echo
            if [[ -f reports/ai-bank/discovery-signals.json ]]; then
              node -e "const r=require('./reports/ai-bank/discovery-signals.json'); console.log('- Sources: '+r.sources_succeeded+'/'+r.sources_checked+' successful'); console.log('- Recent release signals: '+r.signal_count); console.log('- Failed feeds: '+r.sources_failed.length);"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve discovery report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-bank-discovery-${{ github.run_id }}
          path: reports/ai-bank/discovery-signals.json
          if-no-files-found: warn
          retention-days: 30
