name: Verify Cloudflare Workers Preview without secrets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "articles/**"
      - "index.html"
      - "thu-vien.html"
      - "ngan-hang-ai.html"
      - "sitemap.xml"
      - "feed.xml"
      - "styles.css"
      - "script.js"
      - "data/ai-tools.json"
      - "images/**"
      - "illustrations/**"
      - ".github/workflows/deploy-content-pages-preview.yml"

permissions:
  contents: read

concurrency:
  group: worker-preview-smoke-pr154
  cancel-in-progress: false

jobs:
  verify-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/separate-content-validation-no-prod-20261115' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the branch-isolated Cloudflare Workers Preview
        shell: bash
        run: |
          set -euo pipefail
          base="https://automation-separate-content-ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev"
          ready=false
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$base/" 2>/dev/null || true)"
            if [[ "$code" == "200" ]]; then
              ready=true
              echo "PASS: Worker Preview root returned HTTP 200 on attempt $attempt."
              break
            fi
            echo "Waiting for Worker Preview (attempt $attempt/24; HTTP $code)."
            sleep 10
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Branch Worker Preview did not become ready within four minutes."
            exit 1
          fi

      - name: Verify public content and discovery routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://automation-separate-content-ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev"
          for path in / /thu-vien.html /ngan-hang-ai.html /sitemap.xml /feed.xml /data/ai-tools.json /articles/mcp-filesystem-server-an-toan; do
            code="$(curl --silent --show-error --location --max-time 20 -o /dev/null -w '%{http_code}' "$base$path")"
            if [[ "$code" != "200" ]]; then
              echo "::error::Worker Preview route $path returned HTTP $code"
              exit 1
            fi
            echo "PASS: $path returned HTTP 200"
          done

          library="$(curl --fail --silent --show-error --location --max-time 20 "$base/thu-vien.html")"
          printf '%s' "$library" | grep -Eq '72[[:space:]]+bài' || {
            echo "::error::Worker Preview library does not display the expected 72-article count."
            exit 1
          }
          echo "PASS: Worker Preview library displays 72 articles."

          catalog="$(curl --fail --silent --show-error --location --max-time 20 "$base/data/ai-tools.json")"
          printf '%s' "$catalog" | grep -q '"tools"' || {
            echo "::error::Worker Preview AI Bank JSON is missing the tools collection."
            exit 1
          }
          echo "PASS: Worker Preview AI Bank JSON is readable."

      - name: Verify Worker Preview security headers
        shell: bash
        run: |
          set -euo pipefail
          base="https://automation-separate-content-ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev"
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          curl --fail --silent --show-error --location --max-time 20 -D "$headers" -o /dev/null "$base/"
          for expected in \
            'X-Content-Type-Options: nosniff' \
            'X-Frame-Options: DENY' \
            'Referrer-Policy: strict-origin-when-cross-origin' \
            'Strict-Transport-Security: max-age=31536000'; do
            grep -Fqi "$expected" "$headers" || {
              echo "::error::Worker Preview is missing security header: $expected"
              exit 1
            }
          done
          echo "PASS: required Worker Preview security headers are present."
