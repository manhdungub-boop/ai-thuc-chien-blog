name: Agent Runtime Cloudflare DO Fault Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-cloudflare-do-fault-test
  cancel-in-progress: false

jobs:
  isolated-do-fault-test:
    if: >-
      github.repository == 'manhdungub-boop/ai-thuc-chien-blog' &&
      github.ref == 'refs/heads/security/cloudflare-do-fault-suite-20261124' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: agent-runtime-preview
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: "92cf091bbac8b4879ec65feb30b4715b"
      PREVIEW_WORKER_NAME: "ai-thuc-chien-agent-runtime-preview"
      FAULT_TEST_URL: "https://ai-thuc-chien-agent-runtime-preview.manhdungub.workers.dev"
      FAULT_TEST_CONFIG: "agents/runtime/wrangler.fault-test.jsonc"
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact branch and commit pin
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "manhdungub-boop/ai-thuc-chien-blog"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/security/cloudflare-do-fault-suite-20261124"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f "$FAULT_TEST_CONFIG"
          test -f agents/runtime/tests/state-store-test-worker.mjs

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify Workers Free plan before any deployment
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Preview deployment credential unavailable; no deployment attempted."
            exit 1
          fi
          response="$RUNNER_TEMP/cloudflare-subscriptions.json"
          status="$(curl --silent --show-error --max-time 15 --output "$response" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")"
          test "$status" = "200"
          PLAN_RESPONSE="$response" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const payload = JSON.parse(await readFile(process.env.PLAN_RESPONSE, 'utf8'));
          assert.equal(payload?.success, true);
          assert.ok(Array.isArray(payload.result));
          const info = payload.result_info;
          assert.ok(info && info.page === 1 && Number.isSafeInteger(info.per_page));
          const complete = info.next_page === false ||
            (info.next_page === undefined && Number.isSafeInteger(info.count) &&
             Number.isSafeInteger(info.total_count) &&
             info.count === payload.result.length && info.total_count === payload.result.length);
          assert.equal(complete, true, 'subscription listing must be complete');
          const inactive = new Set(['Cancelled', 'Failed', 'Expired']);
          for (const sub of payload.result) {
            if (inactive.has(sub?.state)) continue;
            assert.equal(sub?.price, 0, 'active non-zero price subscription blocks the test');
            const label = [sub?.rate_plan?.id, sub?.rate_plan?.public_name, sub?.rate_plan?.name]
              .filter(v => typeof v === 'string').join(' ').toLowerCase();
            assert.match(label, /(^|[^a-z0-9])free([^a-z0-9]|$)/,
              'every active subscription must be explicitly Free');
          }
          console.log(JSON.stringify({ workersPlan: payload.result.length === 0 ? 'free-default' : 'free', subscriptions: payload.result.length }));
          NODE

      - name: Validate isolated SQLite class and existing Preview bindings
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const c = JSON.parse(await readFile(process.env.FAULT_TEST_CONFIG, 'utf8'));
          assert.equal(c.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(c.main, './tests/state-store-test-worker.mjs');
          assert.equal(c.workers_dev, true);
          assert.equal(c.preview_urls, false);
          assert.deepEqual(c.durable_objects.bindings, [
            { name: 'AGENT_STATE_STORE', class_name: 'TestAgentStateStore' },
            { name: 'AGENT_STATE_STORE_ORIGINAL', class_name: 'AgentStateStore' },
            { name: 'AGENT_REVIEWER_AUTH_STORE', class_name: 'AgentReviewerAuthStore' },
            { name: 'AGENT_DRAFT_STORE', class_name: 'AgentDraftStore' },
            { name: 'AGENT_AI_BANK_CANDIDATE_STORE', class_name: 'AgentAIBankCandidateStore' }
          ]);
          assert.deepEqual(c.migrations, [
            { tag: 'v1', new_sqlite_classes: ['AgentStateStore'] },
            { tag: 'v2', new_sqlite_classes: ['AgentReviewerAuthStore', 'AgentDraftStore'] },
            { tag: 'v3-ai-bank-candidate-store', new_sqlite_classes: ['AgentAIBankCandidateStore'] },
            { tag: 'fault-test-v1', new_sqlite_classes: ['TestAgentStateStore'] }
          ]);
          assert.equal(c.vars.AGENT_ENABLED, 'true');
          assert.equal(c.vars.AGENT_PAUSED, 'false');
          assert.equal(c.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal(c.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          assert.equal(c.vars.AGENT_OIDC_ENABLED, 'false');
          assert.equal(c.ratelimits?.[0]?.name, 'AGENT_INGRESS_RATE_LIMITER');
          assert.equal('routes' in c, false);
          assert.equal('d1_databases' in c, false);
          assert.equal('queues' in c, false);
          assert.equal('triggers' in c, false);
          assert.equal('vars' in c && Object.keys(c.vars).some(k => /TOKEN|SECRET|KEY/i.test(k)), false);
          NODE

      - name: Capture original Preview deployment version
        id: capture_original
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_WORKER_NAME"
          deployments="$RUNNER_TEMP/preview-deployments.json"
          status="$(curl --silent --show-error --max-time 15 --output "$deployments" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" "$base/deployments")"
          if [[ "$status" != "200" ]]; then echo "::error::Preview deployments read returned HTTP $status"; cat "$deployments"; exit 1; fi
          DEPLOYMENTS_FILE="$deployments" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, appendFile } from 'node:fs/promises';
          const deployments = JSON.parse(await readFile(process.env.DEPLOYMENTS_FILE, 'utf8'));
          assert.equal(deployments.success, true);
          const list = deployments.result?.deployments;
          assert.ok(Array.isArray(list) && list.length > 0, 'active Preview deployment must be present');
          const active = list[0];
          assert.equal(active.versions?.length, 1, 'Preview must have one active version before test');
          assert.equal(active.versions[0]?.percentage, 100, 'Preview must be serving one version at 100%');
          const originalVersionId = active.versions[0]?.version_id;
          assert.match(originalVersionId ?? '', /^[0-9a-f-]{36}$/i, 'active version ID must be a UUID');
          await appendFile(process.env.GITHUB_OUTPUT, 'original_version_id=' + originalVersionId + '\n');
          console.log('Captured exact active Preview version for rollback.');
          NODE

      - name: Deploy the temporary SQLite fault harness to the existing Preview Worker
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s npx --yes wrangler@4.166.0 deploy --config "$FAULT_TEST_CONFIG" \
            --message "Temporary isolated SQLite fault harness on Preview; restore captured version after test"

      - name: Install a one-run fault-test-only credential
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf 'FAULT_TEST_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx --yes wrangler@4.166.0 secret put AGENT_FAULT_TEST_TOKEN --config "$FAULT_TEST_CONFIG"

      - name: Run real Cloudflare SQLite Durable Object fault suite
        timeout-minutes: 5
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/fault-suite-result.json"
          status=000
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --max-time 120 --output "$response" --write-out "%{http_code}" \
              --request POST "$FAULT_TEST_URL/__test/fault-suite" \
              --header "Authorization: Bearer $FAULT_TEST_TOKEN" \
              --header "Content-Type: application/json" \
              --header "Accept: application/json" \
              --data '{}')"
            if [[ "$status" == "200" ]]; then break; fi
            if [[ "$status" != "404" && "$status" != "503" ]]; then
              cat "$response"
              echo "::error::Fault suite returned unexpected HTTP $status."
              exit 1
            fi
            echo "Waiting for isolated Preview fault harness ($attempt/12; HTTP $status)."
            sleep 5
          done
          test "$status" = "200" || { cat "$response"; echo "::error::Fault suite did not return HTTP 200."; exit 1; }
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const r = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/fault-suite-result.json', 'utf8'));
          assert.equal(r.ok, true);
          for (const key of [
            'pauseInFlightCancelled',
            'staleOwnerAndGenerationRejected',
            'leaseExpiryRequeued',
            'currentGenerationCompleted',
            'externalRequestBudgetExhausted',
            'circuitBreakerCancelledRunningLease',
            'sqliteTransactionRollback',
            'recoveryAlarmDisabled',
            'isolatedNamespace',
          ]) assert.equal(r[key], true, key + ' must be verified');
          assert.equal(r.circuitBreakerOpenedAtFailures, 5);
          assert.equal(r.externalRequestBudgetLimit, 8);
          console.log(JSON.stringify(r, null, 2));
          NODE

      - name: Remove one-run secret and restore exact original Preview version
        if: always() && steps.capture_original.outputs.original_version_id != ''
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_WORKER_TOKEN }}
          ORIGINAL_VERSION_ID: ${{ steps.capture_original.outputs.original_version_id }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_WORKER_NAME"
          secret_status="$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/delete-test-secret.json" --write-out "%{http_code}" \
            --request DELETE --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" "$base/secrets/AGENT_FAULT_TEST_TOKEN")"
          if [[ "$secret_status" != "200" && "$secret_status" != "204" && "$secret_status" != "404" ]]; then
            echo "::error::Could not remove the one-run fault-test secret (HTTP $secret_status)."
            cat "$RUNNER_TEMP/delete-test-secret.json"
            exit 1
          fi
          printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"Restore exact Preview version after isolated SQLite fault test"}}' \
            "$ORIGINAL_VERSION_ID" > "$RUNNER_TEMP/restore-preview.json"
          restore_status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/restore-preview.json.response" --write-out "%{http_code}" \
            --request POST "$base/deployments?force=true" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" --header "Accept: application/json" \
            --data-binary "@$RUNNER_TEMP/restore-preview.json")"
          if [[ "$restore_status" != "200" ]]; then
            cat "$RUNNER_TEMP/restore-preview.json.response"
            echo "::error::Failed to restore the captured Preview Worker version (HTTP $restore_status)."
            exit 1
          fi
          RESTORE_RESPONSE="$RUNNER_TEMP/restore-preview.json.response" ORIGINAL_VERSION_ID="$ORIGINAL_VERSION_ID" \
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const response = JSON.parse(await readFile(process.env.RESTORE_RESPONSE, 'utf8'));
          assert.equal(response.success, true);
          assert.ok(response.result?.versions?.some(v => v.version_id === process.env.ORIGINAL_VERSION_ID && v.percentage === 100));
          NODE
          deployments="$RUNNER_TEMP/restored-deployments.json"
          status="$(curl --silent --show-error --max-time 15 --output "$deployments" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" "$base/deployments")"
          test "$status" = "200"
          DEPLOYMENTS_FILE="$deployments" ORIGINAL_VERSION_ID="$ORIGINAL_VERSION_ID" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const deployments = JSON.parse(await readFile(process.env.DEPLOYMENTS_FILE, 'utf8'));
          assert.equal(deployments.success, true);
          const active = deployments.result?.deployments?.[0];
          assert.ok(active?.versions?.some(v => v.version_id === process.env.ORIGINAL_VERSION_ID && v.percentage === 100),
            'original Preview version must be active after restoration');
          console.log('PASS: exact original Preview version restored after the fault suite.');
          NODE
