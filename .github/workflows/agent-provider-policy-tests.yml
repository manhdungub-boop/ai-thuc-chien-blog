name: Agent Provider Policy Tests

on:
  pull_request:
    paths:
      - "agents/PROVIDER_FALLBACK_POLICY.md"
      - "agents/runtime/src/provider-policy.mjs"
      - "agents/runtime/tests/provider-policy.test.mjs"
      - ".github/workflows/agent-provider-policy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-provider-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run provider policy tests
        run: node --test agents/runtime/tests/provider-policy.test.mjs
