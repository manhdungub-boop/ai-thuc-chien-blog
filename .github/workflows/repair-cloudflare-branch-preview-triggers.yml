name: Cloudflare Branch Preview Trigger Safety Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-branch-preview-safety-validation
  cancel-in-progress: false

jobs:
  validate-only:
    # All API mutations are intentionally disabled until exact Preview trigger identities are re-verified.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run offline Workers Builds trigger fixtures
        run: python -m unittest discover -s scripts -p 'test_configure_cloudflare_worker_builds.py' -v
      - name: Assert no Cloudflare API mutation path is available
        run: node scripts/test_workers_builds_workflow_guard.mjs
