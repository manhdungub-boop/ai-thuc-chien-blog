name: Agent Runtime Durable Object Emulator Tests

on:
  pull_request:
    paths:
      - "agents/runtime/**"
      - ".github/workflows/agent-runtime-emulator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-object-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents/runtime
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install exact direct test dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify direct dependency pins
        run: npm run verify-direct-dependencies
      - name: Run local Durable Object emulator tests
        run: npm test
      - name: Run runtime configuration and security contract tests
        run: node --test tests/runtime-contract.test.mjs
      - name: Generate Cloudflare Worker types
        run: npx wrangler types --config wrangler.jsonc
      - name: Validate Worker deployment configuration without deploying
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
