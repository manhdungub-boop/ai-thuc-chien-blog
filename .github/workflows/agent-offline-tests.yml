name: Agent Offline Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "scripts/validate-agent-task.mjs"
      - "scripts/plan-agent-tasks.mjs"
      - "tests/agent-task-contract.test.mjs"
      - ".github/workflows/agent-offline-tests.yml"

permissions:
  contents: read

concurrency:
  group: agent-offline-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Offline routing and safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate agent registry JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('agents/agent-registry.json', 'utf8'))"
      - name: Check JavaScript syntax
        run: |
          node --check scripts/validate-agent-task.mjs
          node --check scripts/plan-agent-tasks.mjs
      - name: Run focused agent contract tests
        run: node --test tests/agent-task-contract.test.mjs
