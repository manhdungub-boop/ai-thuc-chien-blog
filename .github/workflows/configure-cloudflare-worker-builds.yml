name: Configure Cloudflare Workers Builds
on:
  workflow_dispatch:
    inputs:
      preview_trigger_uuid:
        description: "Exact verified non-production Preview trigger UUID"
        required: true
        type: string
      preview_worker_tag:
        description: "Exact Worker tag returned by Cloudflare for that Preview trigger"
        required: true
        type: string
      preview_branch:
        description: "Exact non-production branch configured on that Preview trigger"
        required: true
        type: string
      preview_commit_sha:
        description: "Optional 40-character commit SHA to queue a Preview build after repair"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: configure-cloudflare-workers-builds
  cancel-in-progress: false
jobs:
  configure-triggers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate Preview-only updater logic
        run: python -m unittest discover -s scripts -p 'test_configure_cloudflare_worker_builds.py' -v
      - name: Update one verified Preview Workers Builds trigger
        env:
          CLOUDFLARE_WORKERS_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
          PREVIEW_TRIGGER_UUID: ${{ inputs.preview_trigger_uuid }}
          PREVIEW_WORKER_TAG: ${{ inputs.preview_worker_tag }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
          PREVIEW_COMMIT_SHA: ${{ inputs.preview_commit_sha }}
        run: python scripts/configure_cloudflare_worker_builds.py
