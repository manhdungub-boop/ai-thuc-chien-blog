name: Content Quality Gate
on:
  pull_request:
    branches: [main]
    paths:
      - "articles/**/*.html"
      - "sitemap.xml"
      - "feed.xml"
      - "scripts/validate_content_pr.py"
      - "scripts/test_worker_security_headers.cjs"
      - "worker.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/health-check.yml"
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - "scripts/test_copy_prompt.cjs"
      - "scripts/test_homepage_search.cjs"
      - "scripts/test_article_navigation.cjs"
      - "scripts/test_homepage_article_coverage.cjs"
      - "index.html"
      - "script.js"
      - "styles.css"
      - ".github/workflows/content-quality.yml"
      - ".github/workflows/health-check.yml"
permissions:
  contents: read
jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Test copy-to-clipboard interactions
        run: node scripts/test_copy_prompt.cjs
      - name: Check Worker syntax
        run: node --check worker.mjs
      - name: Test Worker security headers
        run: node scripts/test_worker_security_headers.cjs
      - name: Test homepage search behavior
        run: node scripts/test_homepage_search.cjs
      - name: Test contextual article navigation
        run: node scripts/test_article_navigation.cjs
      - name: Test homepage discovery for every published article
        run: node scripts/test_homepage_article_coverage.cjs
      - name: Validate changed articles
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/validate_content_pr.py
