name: Configure Cloudflare Workers Builds
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: configure-cloudflare-workers-builds
  cancel-in-progress: false
jobs:
  configure-triggers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate updater logic
        run: python -m unittest discover -s scripts -p 'test_configure_cloudflare_worker_builds.py' -v
      - name: Update verified Workers Builds triggers
        env:
          CLOUDFLARE_WORKERS_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
        run: python scripts/configure_cloudflare_worker_builds.py
