            fi
            echo "OIDC run gate is not ready yet (attempt $attempt/12); no task was submitted."
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::OIDC run gate did not become stable; refusing to request a token or run a task."
            cat "$RUNNER_TEMP/oidc-readiness.json"
            exit 1
          fi
