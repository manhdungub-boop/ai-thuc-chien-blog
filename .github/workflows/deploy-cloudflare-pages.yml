name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static site files
        run: npm run build

      - name: Check for Cloudflare deployment token
        id: pages_token
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo "::error::Cloudflare deploy stopped: add CLOUDFLARE_API_TOKEN as a repository Actions secret."
            exit 1
          fi
          echo "Cloudflare deployment token is configured."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 92cf091bbac8b4879ec65feb30b4715b
          command: pages deploy dist --project-name=ai-thuc-chien-blog --branch=main
