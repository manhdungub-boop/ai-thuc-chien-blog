name: Static CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build static site and SEO feeds
        run: npm run build

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check worker.mjs
          node --check tests/staging-google-oidc-runtime.test.mjs
          node --check scripts/test_google_oauth_worker_integration.mjs

      - name: Test Worker runtime and security headers
        run: |
          node scripts/test_worker_headers.mjs
          node scripts/test_worker_retrieval.mjs
          node scripts/test_community_api.mjs
          node scripts/test_email_verification.mjs
          node scripts/test-password-reset.mjs
          node --test tests/staging-google-oidc-runtime.test.mjs
          node scripts/test_google_oauth_worker_integration.mjs
          node scripts/test_homepage_search.cjs
          node scripts/verify-release-safety.mjs
          node --check scripts/check-ai-tools-links.mjs
          node scripts/test-ai-tools-links-security.mjs

      - name: Test community D1 schema
        run: python3 scripts/test_community_schema.py

      - name: Rehearse additive Google OAuth migration in local SQLite
        run: python3 scripts/test_google_oauth_migration.py

      - name: Test isolated D1 configuration for previews
        run: node scripts/test_d1_preview_config.cjs

      - name: Test article content quality
        run: npm run test:content

      - name: Validate AI bank catalog and review queue
        run: |
          node scripts/validate-ai-tools-catalog.mjs data/ai-tools.json
          node scripts/test-ai-tools-catalog-ui.mjs
          node scripts/audit-ai-tools-catalog.mjs data/ai-tools.json docs/reviews/ai-tools-candidates-2026-11-02.json --strict
          node scripts/test-ai-tools-catalog-audit.mjs

      - name: Check official AI tool links
        run: node scripts/check-ai-tools-links.mjs data/ai-tools.json

      - name: Verify article authorship, attribution, and diagrams
        run: |
          node scripts/verify-article-attribution.mjs
          node scripts/verify-article-diagrams.mjs

      - name: Test SEO consistency
        run: npm run test:seo

      - name: Test accessibility and performance basics
        run: node scripts/test_accessibility_performance.cjs

      - name: Test copy prompt interactions
        run: node scripts/test_copy_prompt.cjs

      - name: Test article navigation
        run: node scripts/test_article_navigation.cjs

      - name: Test homepage article coverage
        run: node scripts/test_homepage_article_coverage.cjs
