name: Deploy Visitor Analytics candidate to isolated Auth Preview

on:
  push:
    branches:
      - feature/visitor-analytics-topic-presence
    paths:
      - "script.js"
      - "worker.mjs"
      - "index.html"
      - "styles.css"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.preview-migrations.jsonc"
      - ".github/workflows/deploy-google-login-preview.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visitor-analytics-auth-preview
  cancel-in-progress: false

jobs:
  deploy-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated visitor analytics branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/visitor-analytics-topic-presence
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build static assets
        run: npm run build

      - name: Create and verify Preview-only Wrangler config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("wrangler.jsonc").read_text(encoding="utf-8"))
          assert config["name"] == "ai-thuc-chien-blog", "Unexpected source Worker"
          previews = config.get("previews", {}).get("d1_databases", [])
          assert len(previews) == 1, "Expected exactly one isolated Preview D1"
          assert previews[0]["database_id"] == "51d814c8-a3fc-4481-a5f1-60bc67617f3c", "Refusing unexpected Preview D1"
          assert previews[0]["database_name"] == "ai-thuc-chien-community-preview", "Refusing unexpected Preview database"
          config["name"] = "ai-thuc-chien-blog-auth-app-preview"
          config["d1_databases"] = previews
          config.pop("previews", None)
          assert config["d1_databases"][0]["database_id"] != "fc2517cb-9543-4d7b-98f4-bcd5f3c013e7", "Production D1 is forbidden"
          assert config["name"] != "ai-thuc-chien-blog", "Production Worker is forbidden"
          Path("wrangler.preview.deploy.jsonc").write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("PASS: target Worker and D1 are the isolated Preview resources; no migrations will run.")
          PY

      - name: Test rate-limit retention cleanup logic
        run: node scripts/test_rate_limit_retention.mjs

      - name: Deploy to isolated Auth Preview Worker only
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          wranglerVersion: "4.161.0"
          accountId: 92cf091bbac8b4879ec65feb30b4715b
          command: deploy --config wrangler.preview.deploy.jsonc

      - name: Apply pending migrations to the isolated Preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npx --yes wrangler@4.161.0 d1 migrations apply "ai-thuc-chien-community-preview" --remote --config wrangler.preview-migrations.jsonc

      - name: Verify Preview analytics endpoints and OAuth provider configuration
        run: |
          node --input-type=module <<'JS'
          const base = "https://ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev";
          const response = await fetch(base + "/api/community/oauth/providers");
          if (!response.ok) throw new Error(`Preview provider endpoint returned HTTP ${response.status}`);
          const providers = await response.json();
          if (providers.google !== true) throw new Error("Google OAuth is not enabled on Preview");
          const stats = await fetch(base + "/api/community/analytics/stats");
          if (!stats.ok) throw new Error(`Analytics stats returned HTTP ${stats.status}`);
          const totals = await stats.json();
          if (!Number.isFinite(totals.totalViews)) throw new Error("Analytics totalViews is missing or invalid");
          const presence = await fetch(base + "/api/community/presence?topic=tools");
          if (!presence.ok) throw new Error(`Public presence count returned HTTP ${presence.status}`);
          const online = await presence.json();
          if (online.topic !== "tools" || !Number.isFinite(online.onlineMembers)) throw new Error("Presence response is invalid");
          const me = await fetch(base + "/api/community/me");
          if (!me.ok) throw new Error(`Unauthenticated /me returned HTTP ${me.status}`);
          const own = await me.json();
          if (own.member !== null || Object.hasOwn(own, "currentIp")) throw new Error("Unauthenticated visitor must not receive an IP address");
          console.log("PASS: Google OAuth configured; aggregate stats, public online count and unauthenticated IP privacy verified.");
          JS

      - name: Record deployment boundary
        if: always()
        run: |
          {
            echo "## Isolated Preview deployment"
            echo "- Worker: ai-thuc-chien-blog-auth-app-preview"
            echo "- D1: ai-thuc-chien-community-preview (51d814c8-a3fc-4481-a5f1-60bc67617f3c)"
            echo "- Migration 0007 was applied only to the isolated Preview D1 listed above."
            echo "- No Production Worker, Production D1, DNS or Production secrets were changed."
          } >> "$GITHUB_STEP_SUMMARY"
