name: Deploy Agent Runtime Preview (Manual Only)

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: "Confirm deployment to the isolated Agent Runtime Preview only. No recurring Workflow schedule is installed. The Agent remains disabled and paused; no task execution or Production access is enabled."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-thuc-chien-agent-runtime-preview-deploy
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/agent-authoring-revision-queue-20261120' && inputs.confirm_preview_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/runtime
    env:
      CLOUDFLARE_ACCOUNT_ID: "92cf091bbac8b4879ec65feb30b4715b"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Require a dedicated least-privilege Preview token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_AGENT_PREVIEW_API_TOKEN. Add a dedicated Cloudflare API token scoped to Workers Scripts: Edit for this account. Never reuse the Production deployment token."
            exit 1
          fi

      - name: Install exact direct test dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify dependency pins and run tests
        run: |
          npm run verify-direct-dependencies
          npm test
          node --test tests/runtime-contract.test.mjs

      - name: Validate the paused Preview Worker with no recurring Workflow schedule without deploying
        run: |
          npx wrangler types --config wrangler.preview.jsonc
          npx wrangler deploy --dry-run --config wrangler.preview.jsonc

      - name: Deploy isolated Agent Runtime Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.preview.jsonc 2>&1 | tee "$RUNNER_TEMP/agent-runtime-preview-deploy.log"
          worker_url="$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/agent-runtime-preview-deploy.log" | tail -n 1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "::error::Wrangler did not report a workers.dev URL; refusing to claim a successful health check."
            exit 1
          fi
          printf '%s\n' "$worker_url" > "$RUNNER_TEMP/agent-runtime-preview-url.txt"

      - name: Verify Preview health is paused and no recurring Workflow schedule is configured
        shell: bash
        run: |
          set -euo pipefail
          worker_url="$(cat "$RUNNER_TEMP/agent-runtime-preview-url.txt")"
          curl --fail --silent --show-error --max-time 20 "$worker_url/health" -o "$RUNNER_TEMP/agent-runtime-preview-health.json"
          jq -e '
            .ok == true and
            .service == "ai-thuc-chien-agent-runtime-preview" and
            .enabled == false and
            .paused == true and
            .scheduler == "manual_only_no_cron" and
            .task_execution_enabled == false and
            .ai_inference_enabled == false and
            .content_draft_executor_registered == true and
            .content_draft_executor_enabled == false and
            .quality_review_executor_enabled == false and
            .website_publication_enabled == false and
            .facebook_publication_enabled == false and
            .reviewer_auth_enabled == false and
            .task_enqueue_endpoint_enabled == false and
            .production_access == false
          ' "$RUNNER_TEMP/agent-runtime-preview-health.json" >/dev/null
          {
            echo "## Agent Runtime Preview"
            echo "- Preview URL: $worker_url"
            echo "- Health: PASS"
            echo "- Agent execution: disabled and paused"
            echo "- Preview Workflow schedule: none (manual-only; no recurring invocation)"
            echo "- AI inference and autonomous article generation/publication: disabled"
            echo "- Human-only authoring scaffold code: available but runtime execution remains paused"
            echo "- Production Worker/D1/DNS access: none"
          } >> "$GITHUB_STEP_SUMMARY"
