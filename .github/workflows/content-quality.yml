name: Content Quality Gate
on:
  pull_request:
    branches: [main]
    paths:
      - "articles/**/*.html"
      - "sitemap.xml"
      - "feed.xml"
      - "scripts/test_seo_consistency.cjs"
      - "package.json"
      - ".github/workflows/content-quality.yml"
permissions:
  contents: read
jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check SEO consistency
        run: npm run test:seo
