name: Static CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site and SEO feeds
        run: npm run build

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check worker.mjs

      - name: Test Worker runtime and security headers
        run: |
          node scripts/test_worker_headers.mjs
          node scripts/test_worker_retrieval.mjs
          node scripts/test_community_api.mjs
          node scripts/test_health_endpoint.mjs
          node scripts/test_homepage_search.cjs

      - name: Test AI catalog integrity simulations
        run: node scripts/test_ai_catalog.mjs

      - name: Test community registration frontend contract
        run: npm run test:community:frontend

      - name: Test community D1 schema
        run: python3 scripts/test_community_schema.py

      - name: Test isolated D1 configuration for previews
        run: node scripts/test_d1_preview_config.cjs

      - name: Test article content quality
        run: npm run test:content

      - name: Test SEO consistency
        run: npm run test:seo

      - name: Test accessibility and performance basics
        run: node scripts/test_accessibility_performance.cjs

      - name: Test copy prompt interactions
        run: node scripts/test_copy_prompt.cjs

      - name: Test article navigation
        run: node scripts/test_article_navigation.cjs

      - name: Test homepage article coverage
        run: node scripts/test_homepage_article_coverage.cjs
