name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare static site files
        run: |
          mkdir -p dist/articles
          cp index.html styles.css script.js robots.txt sitemap.xml favicon.svg 404.html dist/
          cp articles/*.html dist/articles/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 92cf091bbac8b4879ec65feb30b4715b
          command: pages deploy dist --project-name=ai-thuc-chien-blog --branch=main
