name: Agent Runtime Preview Emergency Restore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-preview-emergency-restore
  cancel-in-progress: false

jobs:
  restore-preview:
    name: Restore the known fail-closed Preview version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agent-runtime-preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_WORKER_NAME: ai-thuc-chien-agent-runtime-preview
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_WORKER_TOKEN }}
      ORIGINAL_VERSION_ID: b0c464ca-e5ec-4840-a6f5-4e6082c637fd
    steps:
      - name: Restore known disabled and paused Preview version
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          [[ "$ORIGINAL_VERSION_ID" == "b0c464ca-e5ec-4840-a6f5-4e6082c637fd" ]]
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_WORKER_NAME"
          printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"Emergency restore to known fail-closed Preview version after SQLite fault-test cleanup failure"}}' "$ORIGINAL_VERSION_ID" > "$RUNNER_TEMP/restore.json"
          status="$(curl --silent --show-error --max-time 25 --output "$RUNNER_TEMP/restore-response.json" --write-out "%{http_code}" \
            --request POST "$base/deployments?force=true" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data-binary "@$RUNNER_TEMP/restore.json")"
          if [[ "$status" != "200" ]]; then
            cat "$RUNNER_TEMP/restore-response.json"
            echo "::error::Preview restore API returned HTTP $status."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const response = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/restore-response.json', 'utf8'));
          assert.equal(response.success, true);
          assert.ok(response.result?.versions?.some(v => v.version_id === process.env.ORIGINAL_VERSION_ID && v.percentage === 100));
          NODE

      - name: Verify fail-closed Preview deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_WORKER_NAME"
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/deployments.json" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" "$base/deployments")"
          test "$status" = "200"
          DEPLOYMENTS="$RUNNER_TEMP/deployments.json" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const d = JSON.parse(await readFile(process.env.DEPLOYMENTS, 'utf8'));
          assert.equal(d.success, true);
          const versions = d.result?.deployments?.[0]?.versions ?? [];
          assert.ok(versions.some(v => v.version_id === process.env.ORIGINAL_VERSION_ID && v.percentage === 100));
          console.log('PASS: original fail-closed Preview version is serving 100%.');
          NODE

      - name: Remove temporary fault-test secret
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_WORKER_NAME"
          status="$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/delete-secret.json" --write-out "%{http_code}" \
            --request DELETE --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" "$base/secrets/AGENT_FAULT_TEST_TOKEN")"
          if [[ "$status" != "200" && "$status" != "204" && "$status" != "404" ]]; then
            cat "$RUNNER_TEMP/delete-secret.json"
            echo "::warning::Temporary secret deletion returned HTTP $status; retry cleanup separately."
            exit 1
          fi
          echo "Temporary fault-test secret deletion accepted (HTTP $status)."
