name: Email verification Preview frontend smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-verification-preview-frontend-smoke
  cancel-in-progress: false

jobs:
  preview-frontend-smoke:
    # Manual smoke test only. This workflow has no deployment or Cloudflare credentials.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sync/gitlab-completed-work-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persisting the GitHub token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend smoke-test syntax
        run: node --check scripts/test_community_preview_frontend.mjs
      - name: Verify existing isolated Preview frontend (GET-only)
        env:
          PREVIEW_URL: https://feature-required-email-verification-ai-thuc-chien-blog.manhdungub.workers.dev
        run: node scripts/test_community_preview_frontend.mjs
