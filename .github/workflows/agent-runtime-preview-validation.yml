        run: |
          set -euo pipefail
          generated_config="$GENERATED_CONFIG"
          trap 'rm -f "$generated_config"' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('wrangler.preview.jsonc', 'utf8'));
          assert.equal(config.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(config.vars.AGENT_ENABLED, 'false');
          assert.equal(config.vars.AGENT_PAUSED, 'true');
          assert.equal(config.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal(config.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          config.vars.AGENT_ENABLED = 'true';
          config.vars.AGENT_PAUSED = 'false';
          config.vars.AGENT_OIDC_RUN_ENABLED = 'true';
          config.vars.AGENT_OIDC_RUN_EVENT_NAME = process.env.GITHUB_EVENT_NAME;
