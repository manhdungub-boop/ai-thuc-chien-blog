name: Agent Runtime Preview Preflight (Read Only)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Exact Agent Runtime candidate branch"
        required: true
        type: string
        default: reconcile/agent-runtime-pr339-schema-v7-20261121
      expected_sha:
        description: "Exact 40-character commit SHA to validate"
        required: true
        type: string
      confirm_read_only:
        description: "Confirm tests and Wrangler dry-run only; no deployment or Cloudflare credentials"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-runtime-preview-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.confirm_read_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the selected Agent Runtime branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          persist-credentials: false

      - name: Verify allowlisted branch and exact commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            reconcile/agent-runtime-pr339-schema-v7-20261121) ;;
            *)
              echo "::error::Selected branch is not in the explicit Preview preflight allowlist."
              exit 1
              ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Selected branch HEAD does not match expected SHA; refusing to test a moving target."
            exit 1
          fi
          test -f agents/runtime/src/worker.mjs
          test -f agents/runtime/wrangler.preview.jsonc
          echo "Validated exact source: $TARGET_BRANCH @ $actual_sha"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install isolated Worker test simulator
        run: |
          mkdir -p "$RUNNER_TEMP/agent-runtime-audit"
          cat > "$RUNNER_TEMP/agent-runtime-audit/package.json" <<'JSON'
          {
            "private": true,
            "dependencies": {
              "miniflare": "4.20260730.0"
            },
            "overrides": {
              "miniflare": {
                "sharp": "0.35.5",
                "undici": "7.30.2"
              }
            }
          }
          JSON
          npm install --prefix "$RUNNER_TEMP/agent-runtime-audit" --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/agent-runtime-audit/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Run complete Agent Runtime test suite
        timeout-minutes: 8
        run: timeout --signal=TERM --kill-after=10s 420s node --test agents/runtime/tests/*.test.mjs

      - name: Validate Preview types and Worker bundle without deployment
        working-directory: agents/runtime
        run: |
          npx --yes wrangler@4.166.0 types --config wrangler.preview.jsonc
          npx --yes wrangler@4.166.0 deploy --dry-run --config wrangler.preview.jsonc --outdir "$RUNNER_TEMP/agent-runtime-dry-run"

      - name: Report safety boundary
        run: |
          {
            echo "## Agent Runtime Preview Preflight"
            echo "- Source branch and SHA: verified exactly"
            echo "- Full tests and Wrangler dry-run: completed"
            echo "- Cloudflare credentials: not provided"
            echo "- Deployment, Durable Object migration, Cron, OAuth, AI inference and publication: not performed"
            echo "- Production Worker, D1 and DNS: not accessed"
          } >> "$GITHUB_STEP_SUMMARY"
