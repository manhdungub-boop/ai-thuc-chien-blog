name: Verify Website Health

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Cloudflare Pages", "Deploy Cloudflare Workers"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js for browser-script regression tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build and validate static assets
        run: npm run build

      - name: Check worker runtime and test security headers
        run: |
          node --check script.js
          node --check worker.mjs
          node scripts/test_worker_headers.mjs
          node scripts/test_homepage_search.cjs

      - name: Test isolated D1 configuration for previews
        run: node scripts/test_d1_preview_config.cjs

      - name: Verify configured production and preview D1 databases (read-only API)
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 92cf091bbac8b4879ec65feb30b4715b
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_WORKERS_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_WORKERS_API_TOKEN is required for read-only D1 verification."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_WORKERS_API_TOKEN"
          config_json="$(node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const prod = (config.d1_databases || []).find(x => x.binding === 'DB');
          const preview = ((config.previews || {}).d1_databases || []).find(x => x.binding === 'DB');
          if (!prod || !preview) throw new Error('Both production and preview DB bindings named DB are required.');
          if (!prod.database_id || !preview.database_id || prod.database_id === preview.database_id) {
            throw new Error('Production and preview D1 IDs must both exist and be different.');
          }
          if (!prod.database_name || !preview.database_name || prod.database_name === preview.database_name) {
            throw new Error('Production and preview D1 names must both exist and be different.');
          }
          process.stdout.write(JSON.stringify({production:{id:prod.database_id,name:prod.database_name},preview:{id:preview.database_id,name:preview.database_name}}));
          NODE
          )"
          PRODUCTION_D1_ID="$(jq -r '.production.id' <<< "$config_json")"
          PRODUCTION_D1_NAME="$(jq -r '.production.name' <<< "$config_json")"
          PREVIEW_D1_ID="$(jq -r '.preview.id' <<< "$config_json")"
          PREVIEW_D1_NAME="$(jq -r '.preview.name' <<< "$config_json")"
          verify_database() {
            local label="$1" db_id="$2" expected_name="$3" response status
            response="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 \
              -H "Authorization: Bearer ${CLOUDFLARE_WORKERS_API_TOKEN}" \
              -o "$response" -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${db_id}" || true)"
            if [[ "$status" != "200" ]] || ! jq -e --arg id "$db_id" --arg name "$expected_name" \
              '.success == true and (.result.uuid == $id or .result.id == $id) and .result.name == $name' "$response" >/dev/null; then
              echo "::error::Cloudflare did not confirm the configured ${label} D1 database ID/name (HTTP ${status})."
              jq -r '(.errors[]?.message // empty)' "$response" 2>/dev/null || true
              rm -f "$response"
              exit 1
            fi
            rm -f "$response"
            echo "PASS: ${label} D1 database UUID and name verified (name: ${expected_name})."
          }
          verify_database "production" "$PRODUCTION_D1_ID" "$PRODUCTION_D1_NAME"
          verify_database "preview" "$PREVIEW_D1_ID" "$PREVIEW_D1_NAME"
          echo "PASS: preview D1 is a separate existing database; no schema or user data was changed."

      - name: Diagnose community D1 schema (read-only)
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 92cf091bbac8b4879ec65feb30b4715b
        run: node scripts/diagnose_community_d1.mjs

      - name: Test article content quality
        run: npm run test:content

      - name: Test copy-to-clipboard interactions
        run: node scripts/test_copy_prompt.cjs

      - name: Test contextual article navigation
        run: node scripts/test_article_navigation.cjs

      - name: Test homepage discovery for every published article
        run: node scripts/test_homepage_article_coverage.cjs

      - name: Smoke-test live Workers and Pages deployments
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            "https://ai-thuc-chien-blog.manhdungub.workers.dev"
            "https://ai-thuc-chien-blog.pages.dev"
          )
          paths=(
            "/"
            "/articles/do-luong-hieu-qua-blog"
            "/sitemap.xml"
            "/feed.xml"
            "/google4e45ddcf8facb122.html"
          )
          for host in "${hosts[@]}"; do
            echo "Checking live host: $host"
            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "$headers" "$body"' EXIT
            curl --fail --silent --show-error --location --verbose --max-redirs 5 --max-time 25 -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Site: none' -D "$headers" -o "$body" "$host/"
            if grep -Eqi '404[[:space:]]*[-|:]?[[:space:]]*(not found|page not found)|the page you requested could not be found' "$body"; then
              echo "FAIL: $host homepage appears to contain a branded 404 page"
              exit 1
            fi
            if ! grep -Eqi '<title>[^<]*(AI Thực Chiến|AI Thuc Chien)' "$body"; then
              echo "FAIL: $host homepage title did not match the expected site"
              head -c 500 "$body"
              exit 1
            fi
            for expected in \
              'X-Content-Type-Options: nosniff' \
              'X-Frame-Options: DENY' \
              'Referrer-Policy: strict-origin-when-cross-origin'; do
              if ! grep -Fqi "$expected" "$headers"; then
                echo "FAIL: $host is missing security header: $expected"
                cat "$headers"
                exit 1
              fi
            done
            for path in "${paths[@]:1}"; do
              code="$(curl --silent --show-error --location --max-redirs 5 --max-time 25 -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Site: none' -o /dev/null -w "%{http_code}" "$host$path")"
              if [ "$code" != "200" ]; then
                echo "FAIL: $host$path returned HTTP $code"
                exit 1
              fi
              echo "PASS: $host$path returned HTTP 200"
            done
            rm -f "$headers" "$body"
            trap - EXIT
          done
          echo "LIVE SMOKE TEST PASS: both production hosts and key routes responded successfully."

      - name: Verify deployed article-library and sitemap coverage
        if: github.event_name != 'pull_request'
        env:
          WORKERS_URL: https://ai-thuc-chien-blog.manhdungub.workers.dev
          PAGES_URL: https://ai-thuc-chien-blog.pages.dev
        run: |
          SITE_URL="$WORKERS_URL" node scripts/test_deployed_routes.cjs
          SITE_URL="$PAGES_URL" node scripts/test_deployed_routes.cjs
