name: Agent Runtime Preview Shell Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
    - main
    - integration/agent-runtime-v5-preview-20261120
    - "feat/agent-runtime-**"
    - "fix/agent-runtime-**"
    - "test/agent-runtime-**"
    - "security/agent-runtime-**"
    - "security/fence-leases-on-circuit-breaker-pause-20261123"
    - "chore/agent-runtime-**"
    paths:
      - "agents/runtime/**"
      - ".github/workflows/agent-runtime-preview-validation.yml"
      - ".github/workflows/agent-runtime-operator.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: agent-runtime-preview-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node.js 24)
        with:
          node-version: 22

      - name: Install pinned local Cloudflare runtime simulator with patched transitive dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/agent-runtime-audit"
          cat > "$RUNNER_TEMP/agent-runtime-audit/package.json" <<'JSON'
          {
            "private": true,
            "dependencies": {
              "miniflare": "4.20260730.0"
            },
            "overrides": {
              "miniflare": {
                "sharp": "0.35.5",
                "undici": "7.30.2"
              }
            }
          }
          JSON
          npm install --prefix "$RUNNER_TEMP/agent-runtime-audit" --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/agent-runtime-audit/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Report exact npm dependency advisories
        if: always()
        run: |
          audit_exit=0
          npm audit --prefix "$RUNNER_TEMP/agent-runtime-audit" --audit-level=high --json > "$RUNNER_TEMP/agent-runtime-npm-audit.json" || audit_exit=$?
          NPM_AUDIT_EXIT_CODE="$audit_exit" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/agent-runtime-npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities ?? {};
          const totals = report.metadata?.vulnerabilities;
          const countFields = ['info', 'low', 'moderate', 'high', 'critical', 'total'];
          if (!totals || !countFields.every(field => Number.isSafeInteger(totals[field]) && totals[field] >= 0)) {
            throw new Error('npm audit did not return complete vulnerability metadata; refusing to treat the scan as clean.');
          }
          const auditExitCode = Number(process.env.NPM_AUDIT_EXIT_CODE);
          if (!Number.isInteger(auditExitCode) || auditExitCode < 0) {
            throw new Error('npm audit exit status is unavailable; refusing to treat the scan as clean.');
          }
          if (auditExitCode !== 0 && totals.total === 0) {
            throw new Error('npm audit failed without reporting vulnerability metadata; refusing to treat the scan as clean.');
          }
          console.log(JSON.stringify({
            audit_exit_code: auditExitCode,
            totals,
            packages: Object.entries(vulnerabilities).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: (item.via ?? []).map(v => typeof v === 'string' ? { dependency: v } : ({
                title: v.title,
                url: v.url,
                range: v.range,
                source: v.source,
                cwe: v.cwe,
                cvss: v.cvss?.score
              }))
            }))
          }, null, 2));
          if (totals.high > 0 || totals.critical > 0) {
            throw new Error('High or critical dependency advisories remain in the isolated test dependency tree.');
          }
          NODE

      - name: Check syntax
        run: node --check agents/runtime/src/worker.mjs && node --check agents/runtime/src/state-store.mjs && node --check agents/runtime/src/lease-policy.mjs && node --check agents/runtime/src/internal-auth.mjs && node --check agents/runtime/src/github-oidc-verify.mjs && node --check agents/runtime/src/github-oidc-jwks.mjs && node --check agents/runtime/src/github-oidc-trusted-verify.mjs && node --check agents/runtime/src/github-oidc-authorize.mjs && node --check agents/runtime/src/state-store-client.mjs && node --check agents/runtime/src/task-handlers.mjs && node --check agents/runtime/src/task-snapshot-adapters.mjs && node --check agents/runtime/src/repository-readers.mjs && node --check agents/runtime/src/read-only-agent-manager.mjs && node --check agents/runtime/src/agent-safety-supervisor.mjs && node --check agents/runtime/src/agent-priority-engine.mjs && node --check agents/runtime/src/agent-budget-guard.mjs && node --check agents/runtime/src/usage-evidence-collector.mjs && node --check agents/runtime/src/runtime-admission-controller.mjs && node --check agents/runtime/src/agent-health-monitor.mjs && node --check agents/runtime/src/agent-recovery-planner.mjs && node --check agents/runtime/src/audit-integrity-inspector.mjs

      - name: Run isolated Worker shell and contract tests
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s node --test agents/runtime/tests/*.test.mjs

      - name: Validate Preview types and Worker bundle without deployment
        working-directory: agents/runtime
        run: |
          npx --yes wrangler@4.166.0 types --config wrangler.preview.jsonc
          npx --yes wrangler@4.166.0 deploy --dry-run --config wrangler.preview.jsonc --outdir "$RUNNER_TEMP/agent-runtime-dry-run"

      - name: Verify Preview config is isolated and scheduled dispatcher remains disabled
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('agents/runtime/wrangler.jsonc', 'utf8'));
          const preview = JSON.parse(await readFile('agents/runtime/wrangler.preview.jsonc', 'utf8'));
          const stateStoreSource = await readFile('agents/runtime/src/state-store.mjs', 'utf8');
          assert.equal(config.main, './src/worker.mjs');
          assert.equal(stateStoreSource.includes('/__test/'), false, 'test-only routes must stay outside deployable source');
          assert.equal(stateStoreSource.includes('RUNTIME_TESTING'), false, 'test-only flags must stay outside deployable source');
          assert.equal(stateStoreSource.includes('x-test-now'), false, 'test clock override must stay outside deployable source');
          assert.equal(config.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(config.workers_dev, true);
          assert.equal(config.preview_urls, true);
          assert.equal(config.vars.AGENT_ENABLED, 'false');
          assert.equal(config.vars.AGENT_PAUSED, 'true');
          assert.equal(JSON.stringify(config).includes('RUNTIME_TESTING'), false, 'test-only controls must not be deploy-configurable');
          assert.equal('routes' in config, false);
          assert.equal('d1_databases' in config, false);
          assert.equal('triggers' in config, false);
          assert.equal('queues' in config, false);
          assert.equal('durable_objects' in config, false);
          assert.equal('kv_namespaces' in config, false);
          assert.equal('r2_buckets' in config, false);
          assert.equal(preview.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(preview.main, './src/worker.mjs');
          assert.equal(preview.workers_dev, true);
          assert.equal(preview.preview_urls, false);
          assert.equal(preview.vars.AGENT_ENABLED, 'false');
          assert.equal(preview.vars.AGENT_PAUSED, 'true');
          assert.equal(preview.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal('triggers' in preview, false, 'do not configure recurring invocations until Free-plan headroom is verified and explicitly approved');
          assert.equal(preview.vars.AGENT_OIDC_ENABLED, 'true');
          assert.equal(preview.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          assert.equal(preview.vars.AGENT_REVIEWER_AUTH_ENABLED, 'false');
          assert.equal(preview.vars.AGENT_RATE_LIMIT_REQUIRED, 'true');
          assert.deepEqual(preview.ratelimits, [{
            name: 'AGENT_INGRESS_RATE_LIMITER',
            namespace_id: '20261121',
            simple: { limit: 60, period: 60 }
          }]);
          assert.deepEqual(preview.durable_objects?.bindings, [
            { name: 'AGENT_STATE_STORE', class_name: 'AgentStateStore' },
            { name: 'AGENT_REVIEWER_AUTH_STORE', class_name: 'AgentReviewerAuthStore' },
            { name: 'AGENT_DRAFT_STORE', class_name: 'AgentDraftStore' },
            { name: 'AGENT_AI_BANK_CANDIDATE_STORE', class_name: 'AgentAIBankCandidateStore' }
          ]);
          assert.deepEqual(preview.migrations, [
            { tag: 'v1', new_sqlite_classes: ['AgentStateStore'] },
            { tag: 'v2', new_sqlite_classes: ['AgentReviewerAuthStore', 'AgentDraftStore'] },
            { tag: 'v3-ai-bank-candidate-store', new_sqlite_classes: ['AgentAIBankCandidateStore'] }
          ]);
          assert.equal('routes' in preview, false);
          assert.equal('d1_databases' in preview, false);
          assert.equal('queues' in preview, false);
          assert.equal('kv_namespaces' in preview, false);
          assert.equal('r2_buckets' in preview, false);
          assert.equal('vars' in preview && Object.keys(preview.vars).some(k => /TOKEN|SECRET|KEY/i.test(k)), false);
          const workerSource = await readFile('agents/runtime/src/worker.mjs', 'utf8');
          assert.match(workerSource, /controller\?\.cron !== "\*\/30 \* \* \* \*"/);
          assert.match(workerSource, /AGENT_SCHEDULER_ENABLED !== "true"/);
          assert.match(workerSource, /AGENT_RECOVERY_ALARM_ENABLED !== "true"/);
          assert.match(workerSource, /JSON\.stringify\(\{ maxTasks: 1 \}\)/);
          console.log('PASS: Preview is isolated and has no recurring trigger; scheduled dispatch remains code-only until cost gates pass.');
          NODE

      - name: Assert validation job remains validation-only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const workflow = await readFile('.github/workflows/agent-runtime-preview-validation.yml', 'utf8');
          const parts = workflow.split('  one-shot-preview-e2e:\n');
          assert.equal(parts.length, 2, 'the separately gated one-shot E2E job must exist exactly once');
          const validationWorkflow = parts[0];
          const e2eWorkflow = parts[1];
          const validateJobStart = validationWorkflow.indexOf('  validate:\n');
          const assertionStepStart = validationWorkflow.indexOf('      - name: Assert validation job remains validation-only', validateJobStart);
          const operatorStepStart = validationWorkflow.indexOf('      - name: Verify OIDC operator workflow is manual and pause-only', assertionStepStart);
          assert.ok(validateJobStart >= 0 && assertionStepStart > validateJobStart && operatorStepStart > assertionStepStart, 'validation job and assertion boundaries must exist');
          // Inspect every validation step, including the operator workflow check, but not this assertion's own source.
          const validateJobSource = validationWorkflow.slice(validateJobStart, assertionStepStart) +
            validationWorkflow.slice(operatorStepStart);
          const deployLines = validateJobSource.split('\n').filter(line => line.includes('wrangler@4.166.0 deploy '));
          assert.equal(deployLines.length, 1, 'validation job must contain exactly one Wrangler command');
          assert.match(deployLines[0], /--dry-run/, 'validation Wrangler command must be dry-run only');
          assert.ok(deployLines[0].includes('--config wrangler.preview.jsonc'));
          const assertNoSecretReferences = source => {
            if (/CLOUDFLARE_API_TOKEN:\s*\$\{\{\s*secrets\./i.test(source) ||
                /secrets\.[A-Z0-9_]+/.test(source)) {
              throw new Error('validation job must not reference secret values');
            }
          };
          assertNoSecretReferences(validateJobSource);
          const secretFixture = 'env:\n  CLOUDFLARE_API_TOKEN: ' + '$' + '{{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}';
          assert.throws(() => assertNoSecretReferences(secretFixture), /must not reference secret values/,
            'secret-reference guard must reject a real GitHub Actions secret expression');
          assert.ok(e2eWorkflow.includes("github.event_name == 'pull_request'"));
          assert.ok(e2eWorkflow.includes("github.event.action == 'labeled'"));
          assert.ok(e2eWorkflow.includes("github.event.action == 'synchronize'"));
          assert.ok(e2eWorkflow.includes("github.event.label.name == 'agent-runtime'"));
          assert.ok(e2eWorkflow.includes("github.event.pull_request.labels.*.name"));
          assert.ok(e2eWorkflow.includes("github.actor_id == '342528485'"), 'one-shot E2E must be restricted to repository owner actor');
          assert.ok(e2eWorkflow.includes("github.event.pull_request.head.ref == 'security/fence-leases-on-circuit-breaker-pause-20261123'"));
          assert.ok(e2eWorkflow.includes('id-token: write'));
          assert.ok(e2eWorkflow.includes("config.vars.AGENT_OIDC_RUN_ENABLED = 'true'"));
          assert.ok(e2eWorkflow.includes('config.vars.AGENT_OIDC_RUN_REF = process.env.GITHUB_REF'));
          assert.ok(e2eWorkflow.includes('config.vars.AGENT_OIDC_RUN_WORKFLOW_REF = process.env.GITHUB_WORKFLOW_REF'));
          assert.ok(e2eWorkflow.includes('config.vars.AGENT_OIDC_RUN_ACTOR_ID = process.env.GITHUB_ACTOR_ID'));
          assert.ok(e2eWorkflow.includes("GENERATED_CONFIG: .wrangler.e2e.generated.jsonc"));
          assert.ok(e2eWorkflow.includes('generated_config="$GENERATED_CONFIG"'));
          assert.ok(e2eWorkflow.includes("writeFile(process.env.GENERATED_CONFIG,"));
          assert.ok(e2eWorkflow.includes('--config "$generated_config"'));
          assert.ok(e2eWorkflow.includes("readFile('wrangler.preview.jsonc', 'utf8')"));
          assert.ok(e2eWorkflow.includes('if: always()'), 'rollback must run even after an E2E failure');
          assert.ok(e2eWorkflow.includes('(.result | type)'), 'subscription API responses must be validated before classification');
          assert.ok(e2eWorkflow.includes('free-default'), 'an empty paid-subscription list must map to Cloudflare Workers Free, its documented default plan');
          console.log('PASS: validation remains credential-free; the separately gated owner-only job uses OIDC, Preview-only deployment, and automatic rollback.');
          NODE

      - name: Verify OIDC operator workflow is manual and pause-only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const workflow = await readFile('.github/workflows/agent-runtime-operator.yml', 'utf8');
          assert.match(workflow, /workflow_dispatch:/);
          assert.doesNotMatch(workflow, /schedule:|repository_dispatch:|workflow_run:|pull_request:|push:/);
          assert.match(workflow, /permissions:[\s\S]*?contents: none[\s\S]*?id-token: write/);
          assert.doesNotMatch(workflow, /contents: write|actions: write|packages: write|write-all/i);
          assert.match(workflow, /if:[^\n]*github\.ref\s*==\s*'refs\/heads\/main'/);
          assert.match(workflow, /cancel-in-progress:\s*false/);
          assert.match(workflow, /AGENT_RUNTIME_PREVIEW_URL/);
          assert.match(workflow, /ai-thuc-chien-agent-runtime-preview/);
          assert.match(workflow, /internal\/oidc\/pause/);
          assert.doesNotMatch(workflow, /internal\/oidc\/resume|wrangler\s+deploy|CLOUDFLARE_.*TOKEN/i);
          console.log('PASS: OIDC operator is manual-only, main-ref-only, minimally privileged, serialized, Preview-scoped, and pause-only.');
          NODE
  one-shot-preview-e2e:
    if: >-
      github.event_name == 'pull_request' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'agent-runtime') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'agent-runtime'))
      ) &&
      github.repository == 'manhdungub-boop/ai-thuc-chien-blog' &&
      github.event.pull_request.head.repo.full_name == 'manhdungub-boop/ai-thuc-chien-blog' &&
      github.event.pull_request.head.ref == 'security/fence-leases-on-circuit-breaker-pause-20261123' &&
      github.event.pull_request.base.ref == 'integration/agent-runtime-v5-preview-20261120' &&
      github.actor_id == '342528485'
    needs: validate
    runs-on: ubuntu-latest
    environment: agent-runtime-preview
    timeout-minutes: 15
    concurrency:
      group: agent-runtime-preview-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_ACCOUNT_ID: "92cf091bbac8b4879ec65feb30b4715b"
      AGENT_RUNTIME_PREVIEW_URL: "https://ai-thuc-chien-agent-runtime-preview.manhdungub.workers.dev"
    steps:
      - name: Check out the exact authorized PR commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact branch, actor, and commit pin
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "manhdungub-boop/ai-thuc-chien-blog"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          if [[ "$EVENT_ACTION" == "labeled" ]]; then
            test "$EVENT_LABEL" = "agent-runtime"
          elif [[ "$EVENT_ACTION" == "synchronize" ]]; then
            node --input-type=module -e "import assert from 'node:assert/strict'; const labels = JSON.parse(process.env.EVENT_LABELS); assert.ok(labels.includes('agent-runtime'), 'required agent-runtime label must remain present')"
          else
            echo "Unexpected pull_request action for one-shot E2E: $EVENT_ACTION" >&2
            exit 1
          fi
          test "$EXPECTED_HEAD_REF" = "security/fence-leases-on-circuit-breaker-pause-20261123"
          test "$GITHUB_ACTOR_ID" = "342528485"
          [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/agent-runtime-preview-validation.yml@$GITHUB_REF"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f agents/runtime/wrangler.preview.jsonc
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const c = JSON.parse(await readFile('agents/runtime/wrangler.preview.jsonc', 'utf8'));
          assert.equal(c.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(c.preview_urls, false, 'the exact PR head must keep Preview URLs disabled');
          assert.equal(c.vars.AGENT_ENABLED, 'false');
          assert.equal(c.vars.AGENT_PAUSED, 'true');
          assert.equal(c.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal(c.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          assert.equal(c.vars.AGENT_REVIEWER_AUTH_ENABLED, 'false');
          assert.equal(c.vars.AGENT_RATE_LIMIT_REQUIRED, 'true');
          assert.equal((c.triggers?.crons ?? []).length, 0);
          assert.equal('d1_databases' in c, false);
          assert.equal('routes' in c, false);
          NODE

      - name: Verify Workers Free plan before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Preview deployment credential is unavailable; no deployment attempted."
            exit 1
          fi
          response="$RUNNER_TEMP/cloudflare-subscriptions.json"
          status="$(curl --silent --show-error --output "$response" --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Workers plan could not be verified (HTTP $status); stopped before deployment."
            exit 1
          fi
          # Cloudflare documents Workers Free as the default plan. A successful subscription-list response with no paid Workers subscription therefore means Workers Free.
          plan_check="$(jq -r '
            if .success != true or (.result | type) != "array" then "invalid"
            else
              [.result[]? |
                [
                  (.rate_plan // {} | [.id // "", .public_name // "", .name // ""] | map(tostring) | join(" ")),
                  (.product // "" | if type == "object" then (.name // .id // "") else . end | tostring)
                ] | map(ascii_downcase) | join(" ") | select(test("worker"))
              ] as $worker_plans |
              if ($worker_plans | length) == 0 then "free-default"
              elif all($worker_plans[]; test("free")) then "free"
              else "non-free"
              end
            end
          ' "$response")"
          case "$plan_check" in
            free|free-default)
              echo "Workers Free plan verified (explicit Free subscription or Cloudflare default Free plan with no paid Workers subscription)."
              ;;
            *) echo "::error::Workers plan is not proven Free; deployment stopped."; exit 1 ;;
          esac

      - name: Deploy the one-shot read-only E2E configuration to dedicated Preview
        id: deploy_e2e
        working-directory: agents/runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
          GENERATED_CONFIG: .wrangler.e2e.generated.jsonc
        run: |
          set -euo pipefail
          generated_config="$GENERATED_CONFIG"
          trap 'rm -f "$generated_config"' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('wrangler.preview.jsonc', 'utf8'));
          assert.equal(config.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(config.vars.AGENT_ENABLED, 'false');
          assert.equal(config.vars.AGENT_PAUSED, 'true');
          assert.equal(config.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal(config.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          config.vars.AGENT_ENABLED = 'true';
          config.vars.AGENT_PAUSED = 'false';
          config.vars.AGENT_OIDC_RUN_ENABLED = 'true';
          config.vars.AGENT_OIDC_RUN_REF = process.env.GITHUB_REF;
          config.vars.AGENT_OIDC_RUN_WORKFLOW_REF = process.env.GITHUB_WORKFLOW_REF;
          config.vars.AGENT_OIDC_RUN_ACTOR_ID = process.env.GITHUB_ACTOR_ID;
          assert.equal(config.vars.AGENT_ENABLED, 'true');
          assert.equal(config.vars.AGENT_PAUSED, 'false');
          assert.equal(config.vars.AGENT_OIDC_RUN_ENABLED, 'true');
          assert.equal(config.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal(config.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          assert.equal(config.vars.AGENT_REVIEWER_AUTH_ENABLED, 'false');
          assert.equal((config.triggers?.crons ?? []).length, 0);
          await writeFile(process.env.GENERATED_CONFIG, JSON.stringify(config, null, 2) + '\n', { mode: 0o600 });
          NODE
          timeout --signal=TERM --kill-after=10s 180s npx --yes wrangler@4.166.0 deploy --config "$generated_config" \
            --message "One-shot OIDC read-only E2E; automatic disable/restore follows"

      - name: Wait for the expected enabled Preview configuration before invoking the task
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 10 "$AGENT_RUNTIME_PREVIEW_URL/health" -o "$RUNNER_TEMP/preview-health.json" 2>/dev/null &&
              node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const h = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/preview-health.json', 'utf8'));
          assert.equal(h.ok, true);
          assert.equal(h.service, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(h.enabled, true);
          assert.equal(h.paused, false);
          assert.equal(h.scheduler, 'manual_only_no_cron');
          assert.equal(h.reviewer_auth_enabled, false);
          assert.equal(h.publication_authorized, false);
          NODE
            then
              ready=true
              break
            fi
            echo "The expected enabled Preview version is not serving yet (attempt $attempt/10)."
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::The expected enabled Preview configuration did not become healthy; refusing to invoke the task."
            exit 1
          fi

      - name: Invoke exactly one allowlisted task with a short-lived GitHub OIDC token
        timeout-minutes: 2
        env:
          OIDC_AUDIENCE: ai-thuc-chien-agent-runtime-preview
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) throw new Error('GitHub OIDC request context unavailable');
          const tokenUrl = new URL(requestUrl);
          tokenUrl.searchParams.set('audience', process.env.OIDC_AUDIENCE);
          const tokenResponse = await fetch(tokenUrl, {
            method: 'GET',
            headers: { Authorization: 'Bearer ' + requestToken, Accept: 'application/json' },
            redirect: 'error',
            cache: 'no-store',
            signal: AbortSignal.timeout(10000),
          });
          if (!tokenResponse.ok) throw new Error('GitHub OIDC token request failed: HTTP ' + tokenResponse.status);
          const payload = JSON.parse(await tokenResponse.text());
          if (typeof payload.value !== 'string' || payload.value.length < 100 || payload.value.length > 16384) {
            throw new Error('GitHub OIDC token response invalid');
          }
          const response = await fetch(process.env.AGENT_RUNTIME_PREVIEW_URL + '/internal/oidc/run', {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + payload.value,
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify({ task: {
              type: 'content.review',
              idempotencyKey: `oidc-preview-e2e:pr368-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
              payload: { articlePath: 'articles/ai-agent-thuc-hanh-tu-thiet-ke-den-kiem-soat.html' },
            } }),
            redirect: 'error',
            cache: 'no-store',
            signal: AbortSignal.timeout(25000),
          });
          const result = JSON.parse(await response.text());
          const item = result?.items?.[0];
          if (!response.ok || result?.ok !== true || result?.summary?.total !== 1 ||
              result?.summary?.succeeded !== 1 || item?.state !== 'succeeded' ||
              item?.result?.taskType !== 'content.review' || result?.persistence?.verified !== true ||
              result?.persistence?.state !== 'succeeded' ||
              !['task.queued', 'task.claimed', 'task.succeeded'].every(type =>
                result.persistence.auditEvents?.[type]?.after >= result.persistence.auditEvents?.[type]?.before + 1)) {
            throw new Error('One-shot read-only task or durable audit verification failed: ' +
              JSON.stringify({ httpStatus: response.status, error: result?.error, diagnosticCode: result?.diagnosticCode, state: item?.state }));
          }
          console.log(JSON.stringify({
            ok: true,
            taskId: item.taskId,
            state: item.state,
            taskType: item.result.taskType,
            reviewStatus: item.result.status,
            findingCount: item.result.findingCount,
            auditVerified: result.persistence.verified,
            auditEventTypes: Object.keys(result.persistence.auditEvents),
          }));
          NODE

      - name: Always restore Preview to disabled and paused configuration
        timeout-minutes: 5
        if: always() && steps.deploy_e2e.outcome != 'skipped'
        working-directory: agents/runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Cannot restore Preview because the Cloudflare deployment credential is unavailable."
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 180s npx --yes wrangler@4.166.0 deploy --config wrangler.preview.jsonc \
            --message "Restore Agent Runtime Preview disabled and paused after one-shot E2E"
          restored=false
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 10 "$AGENT_RUNTIME_PREVIEW_URL/health" -o "$RUNNER_TEMP/preview-health-restored.json" 2>/dev/null &&
              node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const h = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/preview-health-restored.json', 'utf8'));
          assert.equal(h.ok, true);
          assert.equal(h.enabled, false);
          assert.equal(h.paused, true);
          assert.equal(h.scheduler, 'manual_only_no_cron');
          assert.equal(h.reviewer_auth_enabled, false);
          assert.equal(h.publication_authorized, false);
          NODE
            then
              restored=true
              break
            fi
            echo "Preview health has not converged to disabled/paused yet (attempt $attempt/10)."
            sleep 3
          done
          if [[ "$restored" != "true" ]]; then
            echo "::error::Preview did not report the required disabled/paused state within the bounded rollback verification window."
            exit 1
          fi
          echo "Preview is restored and verified disabled/paused after bounded health polling."

