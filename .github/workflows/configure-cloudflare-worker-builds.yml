name: Validate Cloudflare Workers Builds safety helpers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-builds-safety-validation
  cancel-in-progress: false

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Run offline trigger validation fixtures
        run: python -m unittest discover -s scripts -p 'test_configure_cloudflare_worker_builds.py' -v
      - name: Assert updater and workflow remain non-mutating
        run: node scripts/test_workers_builds_workflow_guard.mjs
