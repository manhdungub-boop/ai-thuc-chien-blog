name: Agent Runtime Preview Shell Validation
# Re-run validation against the current AI Bank base workflow; automatic E2E stays restricted.
# Trigger validation against the updated PR-base workflow branch filter; E2E remains gated.
# The base-branch validation job asserts this exact owner-only manual-dispatch contract.
# Manual dispatch is owner-pinned; automatic PR E2E remains on the pre-existing security allowlist.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
    - main
    - integration/agent-runtime-v5-preview-20261120
    - "feat/agent-runtime-**"
    - "fix/agent-runtime-**"
    - "fix/ai-bank-discovery-ingestion-gate-20261127"
    - "test/agent-runtime-**"
    - "security/agent-runtime-**"
    - "security/fence-leases-on-circuit-breaker-pause-20261123"
    - "security/cloudflare-do-fault-suite-20261124"
    - "chore/agent-runtime-**"
    paths:
      - "agents/runtime/**"
      - ".github/workflows/agent-runtime-preview-validation.yml"
      - ".github/workflows/agent-runtime-operator.yml"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open same-repository pull request number to validate
        required: true
        type: number
      expected_head_sha:
        description: Exact 40-character PR head SHA to validate and deploy to Preview
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: agent-runtime-preview-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '342528485'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR head validated by the one-shot E2E job
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node.js 24)
        with:
          node-version: 22

      - name: Install pinned local Cloudflare runtime simulator with patched transitive dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/agent-runtime-audit"
          cat > "$RUNNER_TEMP/agent-runtime-audit/package.json" <<'JSON'
          {
            "private": true,
            "dependencies": {
              "miniflare": "4.20260730.0"
            },
            "overrides": {
              "miniflare": {
                "sharp": "0.35.5",
                "undici": "7.30.2"
              }
            }
          }
          JSON
          npm install --prefix "$RUNNER_TEMP/agent-runtime-audit" --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/agent-runtime-audit/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Report exact npm dependency advisories
        if: always()
        run: |
          audit_exit=0
          npm audit --prefix "$RUNNER_TEMP/agent-runtime-audit" --audit-level=high --json > "$RUNNER_TEMP/agent-runtime-npm-audit.json" || audit_exit=$?
          NPM_AUDIT_EXIT_CODE="$audit_exit" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/agent-runtime-npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities ?? {};
          const totals = report.metadata?.vulnerabilities;
          const countFields = ['info', 'low', 'moderate', 'high', 'critical', 'total'];
          if (!totals || !countFields.every(field => Number.isSafeInteger(totals[field]) && totals[field] >= 0)) {
            throw new Error('npm audit did not return complete vulnerability metadata; refusing to treat the scan as clean.');
          }
          const auditExitCode = Number(process.env.NPM_AUDIT_EXIT_CODE);
          if (!Number.isInteger(auditExitCode) || auditExitCode < 0) {
            throw new Error('npm audit exit status is unavailable; refusing to treat the scan as clean.');
          }
          if (auditExitCode !== 0 && totals.total === 0) {
            throw new Error('npm audit failed without reporting vulnerability metadata; refusing to treat the scan as clean.');
          }
          console.log(JSON.stringify({
            audit_exit_code: auditExitCode,
            totals,
            packages: Object.entries(vulnerabilities).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: (item.via ?? []).map(v => typeof v === 'string' ? { dependency: v } : ({
                title: v.title,
                url: v.url,
                range: v.range,
                source: v.source,
                cwe: v.cwe,
                cvss: v.cvss?.score
              }))
            }))
          }, null, 2));
          if (totals.high > 0 || totals.critical > 0) {
            throw new Error('High or critical dependency advisories remain in the isolated test dependency tree.');
          }
          NODE

      - name: Check syntax
        run: node --check agents/runtime/src/worker.mjs && node --check agents/runtime/src/state-store.mjs && node --check agents/runtime/src/lease-policy.mjs && node --check agents/runtime/src/internal-auth.mjs && node --check agents/runtime/src/github-oidc-verify.mjs && node --check agents/runtime/src/github-oidc-jwks.mjs && node --check agents/runtime/src/github-oidc-trusted-verify.mjs && node --check agents/runtime/src/github-oidc-authorize.mjs && node --check agents/runtime/src/state-store-client.mjs && node --check agents/runtime/src/task-handlers.mjs && node --check agents/runtime/src/task-snapshot-adapters.mjs && node --check agents/runtime/src/repository-readers.mjs && node --check agents/runtime/src/read-only-agent-manager.mjs && node --check agents/runtime/src/agent-safety-supervisor.mjs && node --check agents/runtime/src/agent-priority-engine.mjs && node --check agents/runtime/src/agent-budget-guard.mjs && node --check agents/runtime/src/usage-evidence-collector.mjs && node --check agents/runtime/src/runtime-admission-controller.mjs && node --check agents/runtime/src/agent-health-monitor.mjs && node --check agents/runtime/src/agent-recovery-planner.mjs && node --check agents/runtime/src/audit-integrity-inspector.mjs

      - name: Run isolated Worker shell and contract tests
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s node --experimental-loader ./agents/runtime/tests/cloudflare-workers-loader.mjs --test agents/runtime/tests/*.test.mjs

      - name: Validate Preview and isolated fault-harness bundles without deployment
        working-directory: agents/runtime
        run: |
          npx --yes wrangler@4.166.0 types --config wrangler.preview.jsonc
          npx --yes wrangler@4.166.0 deploy --dry-run --config wrangler.preview.jsonc --outdir "$RUNNER_TEMP/agent-runtime-dry-run"
          npx --yes wrangler@4.166.0 types --config wrangler.fault-test.jsonc
          npx --yes wrangler@4.166.0 deploy --dry-run --config wrangler.fault-test.jsonc --outdir "$RUNNER_TEMP/agent-runtime-fault-test-dry-run"

      - name: Verify Preview config is isolated and scheduled dispatcher remains disabled
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('agents/runtime/wrangler.jsonc', 'utf8'));
          const preview = JSON.parse(await readFile('agents/runtime/wrangler.preview.jsonc', 'utf8'));
          const stateStoreSource = await readFile('agents/runtime/src/state-store.mjs', 'utf8');
          assert.equal(config.main, './src/worker.mjs');
          assert.equal(stateStoreSource.includes('/__test/'), false, 'test-only routes must stay outside deployable source');
          assert.equal(stateStoreSource.includes('RUNTIME_TESTING'), false, 'test-only flags must stay outside deployable source');
          assert.equal(stateStoreSource.includes('x-test-now'), false, 'test clock override must stay outside deployable source');
          assert.equal(config.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(config.workers_dev, true);
          assert.equal(config.preview_urls, true);
          assert.equal(config.vars.AGENT_ENABLED, 'false');
          assert.equal(config.vars.AGENT_PAUSED, 'true');
          assert.equal(JSON.stringify(config).includes('RUNTIME_TESTING'), false, 'test-only controls must not be deploy-configurable');
          assert.equal('routes' in config, false);
          assert.equal('d1_databases' in config, false);
          assert.equal('triggers' in config, false);
          assert.equal('queues' in config, false);
          assert.equal('durable_objects' in config, false);
          assert.equal('kv_namespaces' in config, false);
          assert.equal('r2_buckets' in config, false);
          assert.equal(preview.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(preview.main, './src/worker-preview-recovery.mjs');
          assert.equal(preview.workers_dev, true);
          assert.equal(preview.preview_urls, false);
          assert.equal(preview.vars.AGENT_ENABLED, 'false');
          assert.equal(preview.vars.AGENT_PAUSED, 'true');
          assert.equal(preview.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal('triggers' in preview, false, 'do not configure recurring invocations until Free-plan headroom is verified and explicitly approved');
          assert.equal(preview.vars.AGENT_OIDC_ENABLED, 'true');
          assert.equal(preview.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          assert.equal(preview.vars.AGENT_REVIEWER_AUTH_ENABLED, 'false');
          assert.equal(preview.vars.AGENT_RATE_LIMIT_REQUIRED, 'true');
          assert.deepEqual(preview.ratelimits, [{
            name: 'AGENT_INGRESS_RATE_LIMITER',
            namespace_id: '20261121',
            simple: { limit: 60, period: 60 }
          }]);
          assert.deepEqual(preview.durable_objects?.bindings, [
            { name: 'AGENT_STATE_STORE', class_name: 'AgentStateStore' },
            { name: 'AGENT_REVIEWER_AUTH_STORE', class_name: 'AgentReviewerAuthStore' },
            { name: 'AGENT_DRAFT_STORE', class_name: 'AgentDraftStore' },
            { name: 'AGENT_AI_BANK_CANDIDATE_STORE', class_name: 'AgentAIBankCandidateStore' }
          ]);
          assert.deepEqual(preview.migrations, [
            { tag: 'v1', new_sqlite_classes: ['AgentStateStore'] },
            { tag: 'v2', new_sqlite_classes: ['AgentReviewerAuthStore', 'AgentDraftStore'] },
            { tag: 'v3-ai-bank-candidate-store', new_sqlite_classes: ['AgentAIBankCandidateStore'] },
            { tag: 'fault-test-v1', new_sqlite_classes: ['TestAgentStateStore'] }
          ]);
          assert.equal('routes' in preview, false);
          assert.equal('d1_databases' in preview, false);
          assert.equal('queues' in preview, false);
          assert.equal('kv_namespaces' in preview, false);
          assert.equal('r2_buckets' in preview, false);
          assert.equal('vars' in preview && Object.keys(preview.vars).some(k => /TOKEN|SECRET|KEY/i.test(k)), false);
          const faultTest = JSON.parse(await readFile('agents/runtime/wrangler.fault-test.jsonc', 'utf8'));
          assert.equal(faultTest.vars.AGENT_ENABLED, 'false');
          assert.equal(faultTest.vars.AGENT_PAUSED, 'true');
          assert.equal(faultTest.vars.AGENT_SCHEDULER_ENABLED, 'false');
          assert.equal(faultTest.vars.AGENT_RECOVERY_ALARM_ENABLED, 'false');
          assert.equal(faultTest.name, 'ai-thuc-chien-agent-runtime-fault-test');
          assert.equal(faultTest.main, './tests/state-store-test-worker.mjs');
          assert.deepEqual(faultTest.durable_objects?.bindings, [{ name: 'AGENT_STATE_STORE', class_name: 'TestAgentStateStore' }]);
          assert.deepEqual(faultTest.migrations, [{ tag: 'fault-test-v1', new_sqlite_classes: ['TestAgentStateStore'] }]);
          const faultTestWorkflowSource = await readFile('.github/workflows/agent-runtime-cloudflare-do-fault-test.yml', 'utf8');
          assert.ok(faultTestWorkflowSource.includes('$api/secrets/AGENT_FAULT_TEST_TOKEN'));
          assert.ok(faultTestWorkflowSource.includes('--request POST'));
          assert.ok(faultTestWorkflowSource.includes('{"enabled":false,"previews_enabled":false}'));
          assert.ok(faultTestWorkflowSource.includes('--request DELETE'));
          assert.ok(faultTestWorkflowSource.includes('$api/subdomain'));
          const wranglerDeleteCommand = 'wrangler@4.166.0 ' + 'delete';
          assert.equal(faultTestWorkflowSource.includes(wranglerDeleteCommand), false);
          const faultTestWorkerSource = await readFile('agents/runtime/tests/state-store-test-worker.mjs', 'utf8');
          assert.match(faultTestWorkerSource, /const faultSuiteMode = \{ active: false \}/);
          assert.match(faultTestWorkerSource, /faultSuiteMode\.active && property === "AGENT_ENABLED"/);
          assert.match(faultTestWorkerSource, /faultSuiteMode\.active && property === "AGENT_PAUSED"/);
          assert.match(faultTestWorkerSource, /AGENT_STATE_STORE_TOKEN:\s*env\.AGENT_FAULT_TEST_TOKEN/);
          const faultRouteIndex = faultTestWorkerSource.indexOf('if (url.pathname === "/__test/fault-suite")');
          const enableIndex = faultTestWorkerSource.indexOf("this.faultSuiteMode.active = true");
          const resetIndex = faultTestWorkerSource.indexOf("this.faultSuiteMode.active = false");
          assert.ok(faultRouteIndex >= 0 && enableIndex > faultRouteIndex && resetIndex > enableIndex);
          const workerSource = await readFile('agents/runtime/src/worker.mjs', 'utf8');
          assert.match(workerSource, /controller\?\.cron !== "\*\/30 \* \* \* \*"/);
          assert.match(workerSource, /AGENT_SCHEDULER_ENABLED !== "true"/);
          assert.match(workerSource, /AGENT_RECOVERY_ALARM_ENABLED !== "true"/);
          assert.match(workerSource, /JSON\.stringify\(\{ maxTasks: 1 \}\)/);
          console.log('PASS: Preview is isolated and has no recurring trigger; scheduled dispatch remains code-only until cost gates pass.');
          NODE

      - name: Assert validation job remains validation-only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const workflow = await readFile('.github/workflows/agent-runtime-preview-validation.yml', 'utf8');
          const getValidationJobSource = source => {
            const parts = source.split('  one-shot-preview-e2e:\n');
            assert.equal(parts.length, 2, 'the separately gated one-shot E2E job must exist exactly once');
            const validationWorkflow = parts[0];
            const validateJobStart = validationWorkflow.indexOf('  validate:\n');
            const assertionStepStart = validationWorkflow.indexOf('      - name: Assert validation job remains validation-only', validateJobStart);
            const nextStepOffset = validationWorkflow.indexOf('\n      - ', assertionStepStart + 1);
            const nextStepStart = nextStepOffset < 0 ? -1 : nextStepOffset + 1;
            assert.ok(validateJobStart >= 0 && assertionStepStart > validateJobStart && nextStepStart > assertionStepStart,
              'validation job, assertion, and immediate next-step boundaries must exist');
            return validationWorkflow.slice(validateJobStart, assertionStepStart) + validationWorkflow.slice(nextStepStart);
          };
          const parts = workflow.split('  one-shot-preview-e2e:\n');
          assert.equal(parts.length, 2, 'the separately gated one-shot E2E job must exist exactly once');
          const e2eWorkflow = parts[1];
          const assertNoSecretReferences = source => {
            if (/CLOUDFLARE_API_TOKEN:\s*\$\{\{\s*secrets\./i.test(source) || /secrets\.[A-Z0-9_]+/.test(source)) {
              throw new Error('validation job must not reference secret values');
            }
          };
          const assertValidationOnly = source => {
            const validateJobSource = getValidationJobSource(source);
            const deployLines = validateJobSource.split('\n').filter(line => /^\s*(?:run:\s*)?npx --yes wrangler@4\.166\.0 deploy\b/.test(line));
            assert.equal(deployLines.length, 2, 'validation job must contain exactly two Wrangler deploy commands');
            assert.ok(deployLines.every(line => /--dry-run/.test(line)), 'every validation Wrangler command must be dry-run only');
            assert.ok(deployLines.some(line => line.includes('--config wrangler.preview.jsonc')));
            assert.ok(deployLines.some(line => line.includes('--config wrangler.fault-test.jsonc')));
            assertNoSecretReferences(validateJobSource);
          };
          assertValidationOnly(workflow);
          const injectValidationStep = (source, step) => {
            const marker = '\n      - name: Verify OIDC operator workflow is manual and pause-only';
            const markerIndex = source.lastIndexOf(marker);
            assert.ok(markerIndex > 0, 'the actual following workflow step must exist');
            return source.slice(0, markerIndex) + '\n' + step + source.slice(markerIndex);
          };
          const injectedDeployStep = [
            '      - name: injected deployment regression step',
            '        run: |',
            '          npx --yes wrangler@4.166.0 deploy --config wrangler.preview.jsonc'
          ].join('\n');
          const injectedDeployWorkflow = injectValidationStep(workflow, injectedDeployStep);
          assert.notEqual(injectedDeployWorkflow, workflow, 'the deployment fixture must be inserted after the assertion step');
          assert.throws(() => assertValidationOnly(injectedDeployWorkflow),
            /validation job must contain exactly two Wrangler deploy commands/,
            'validation-only guard must inspect steps after its own assertion'
          );
          const injectedUnnamedDeployStep = [
            '      - run: |',
            '          npx --yes wrangler@4.166.0 deploy --config wrangler.preview.jsonc'
          ].join('\n');
          assert.throws(() => assertValidationOnly(injectValidationStep(workflow, injectedUnnamedDeployStep)),
            /validation job must contain exactly two Wrangler deploy commands/,
            'validation-only guard must inspect unnamed steps after its own assertion'
          );
          const injectedSecretStep = [
            '      - name: injected secret regression step',
            '        env:',
            '          CLOUDFLARE_API_TOKEN: ' + '$' + '{{ ' + 'secrets.' + 'CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}',
            '        run: echo test'
          ].join('\n');
          assert.throws(() => assertValidationOnly(injectValidationStep(workflow, injectedSecretStep)),
            /must not reference secret values/,
            'secret guard must inspect steps inserted immediately after its own assertion');
          const dollar = String.fromCharCode(36);
          const expectedHeadCheckout = "ref: " + dollar + "{{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}";
          assert.ok(workflow.includes(expectedHeadCheckout), "validation must test the exact PR head the E2E job deploys");
          assert.ok(e2eWorkflow.includes("github.event.action == 'synchronize'"));
          const hasManualDispatch = e2eWorkflow.includes("github.event_name == 'workflow_dispatch'");
          if (hasManualDispatch) {
            assert.ok(e2eWorkflow.includes("github.actor_id == '342528485'"), 'manual dispatch path must be restricted to the repository owner');
            assert.ok(e2eWorkflow.includes("github.ref == 'refs/heads/main'"), 'manual dispatch must run only from trusted main');
            assert.ok(e2eWorkflow.includes("inputs.pull_request_number"), 'manual dispatch must require an explicit PR number');
            assert.ok(e2eWorkflow.includes("inputs.expected_head_sha"), 'manual dispatch must require an exact expected head SHA');
          }
          assert.ok(e2eWorkflow.includes("pr.head?.sha, process.env.EXPECTED_SHA"));
          assert.ok(e2eWorkflow.includes("pull-requests: read"));
          assert.ok(e2eWorkflow.includes("github.event.pull_request.labels.*.name"));
          assert.ok(e2eWorkflow.includes("github.actor_id == '342528485'"), 'one-shot E2E must be restricted to repository owner actor');
          assert.ok(e2eWorkflow.includes("github.event.pull_request.head.ref == 'security/fence-leases-on-circuit-breaker-pause-20261123'"));
          assert.ok(e2eWorkflow.includes("github.event.pull_request.head.ref == 'security/agent-runtime-oidc-replay-e2e-20261124'"));
          assert.ok(e2eWorkflow.includes("github.event.pull_request.base.ref == 'integration/agent-runtime-v5-preview-20261120'"));
          assert.ok(!e2eWorkflow.includes("github.event.pull_request.head.ref == 'fix/agent-runtime-manual-e2e-dispatch-20261127'"), 'manual dispatch branch must not widen the automatic PR E2E allowlist');
          assert.ok(!e2eWorkflow.includes("github.event.pull_request.base.ref == 'fix/ai-bank-discovery-ingestion-gate-20261127'"), 'AI Bank branch must not widen the automatic PR E2E base allowlist');
          assert.ok(workflow.includes("cancel-in-progress: ${{ github.event_name == 'pull_request' }}"), 'manual dispatches must not cancel an active E2E run');
          assert.ok(e2eWorkflow.includes('id-token: write'));
          assert.ok(e2eWorkflow.includes('Probe OIDC run gate readiness before requesting the token'));
          assert.ok(e2eWorkflow.includes('github_oidc_token_required'));
          assert.ok(e2eWorkflow.includes("config.vars.AGENT_OIDC_RUN_ENABLED = 'true'"));
          assert.ok(e2eWorkflow.includes('config.vars.AGENT_OIDC_RUN_REF = process.env.GITHUB_REF'));
          assert.ok(e2eWorkflow.includes('config.vars.AGENT_OIDC_RUN_WORKFLOW_REF = process.env.GITHUB_WORKFLOW_REF'));
          assert.ok(e2eWorkflow.includes('config.vars.AGENT_OIDC_RUN_ACTOR_ID = process.env.GITHUB_ACTOR_ID'));
          assert.ok(e2eWorkflow.includes("GENERATED_CONFIG: .wrangler.e2e.generated.jsonc"));
          assert.ok(e2eWorkflow.includes('generated_config="$GENERATED_CONFIG"'));
          assert.ok(e2eWorkflow.includes("writeFile(process.env.GENERATED_CONFIG,"));
          assert.ok(e2eWorkflow.includes('--config "$generated_config"'));
          assert.ok(e2eWorkflow.includes("readFile('wrangler.preview.jsonc', 'utf8')"));
          assert.ok(e2eWorkflow.includes('if: always()'), 'rollback must run even after an E2E failure');
          assert.ok(e2eWorkflow.includes('function classifyCloudflareWorkersPlan'), 'the Free-plan classifier must be present in the gated E2E job');
          assert.ok(e2eWorkflow.includes('info.total_count === payload.result.length'), 'total_count must equal the returned result length when used as completeness proof');
          assert.ok(e2eWorkflow.includes('info.next_page === undefined'), 'total_count cannot override an explicit or malformed next_page marker');
          assert.ok(e2eWorkflow.includes('info.next_page === false'), 'an explicit no-next-page marker may prove complete enumeration');
          assert.ok(e2eWorkflow.includes('explicit next_page=true must override matching totals'), 'contradictory pagination metadata must fail closed');
          assert.ok(e2eWorkflow.includes('missing completeness metadata must fail closed'));
          assert.ok(e2eWorkflow.includes('any active paid subscription blocks the Free-only deployment gate'));
          assert.ok(e2eWorkflow.includes('free-default'), 'an empty, fully enumerated subscription list may map to the documented default Free plan');
          assert.match(e2eWorkflow, /timeout-minutes:\s*20/, 'the E2E job must reserve a bounded total time budget');
          assert.ok(e2eWorkflow.includes('timeout-minutes: 2'), 'checkout and pre-deployment checks must have step deadlines');
          assert.ok(e2eWorkflow.includes('timeout-minutes: 3'), 'temporary deployment must have a step deadline');
          assert.ok(e2eWorkflow.includes('timeout-minutes: 5'), 'rollback must retain its own bounded restoration window');
          console.log('PASS: validation remains credential-free; the separately gated owner-only job uses OIDC, Preview-only deployment, and automatic rollback.');
          NODE
      - name: Verify Cloudflare fault harness is isolated from application and Production
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const testConfig = JSON.parse(await readFile('agents/runtime/wrangler.fault-test.jsonc', 'utf8'));
          const preview = JSON.parse(await readFile('agents/runtime/wrangler.preview.jsonc', 'utf8'));
          const production = JSON.parse(await readFile('agents/runtime/wrangler.jsonc', 'utf8'));
          const harness = await readFile('agents/runtime/tests/state-store-test-worker.mjs', 'utf8');
          const workflow = await readFile('.github/workflows/agent-runtime-cloudflare-do-fault-test.yml', 'utf8');
          assert.equal(testConfig.name, 'ai-thuc-chien-agent-runtime-fault-test');
          assert.equal(testConfig.main, './tests/state-store-test-worker.mjs');
          assert.notEqual(preview.name, testConfig.name, 'fault Worker must be separate from Preview');
          assert.notEqual(production.name, testConfig.name, 'fault Worker must be separate from Production');
          assert.equal(preview.main, './src/worker-preview-recovery.mjs');
          assert.equal(production.main, './src/worker.mjs');
          for (const key of ['AGENT_ENABLED','AGENT_SCHEDULER_ENABLED','AGENT_RECOVERY_ALARM_ENABLED','AGENT_OIDC_ENABLED','AGENT_REVIEWER_AUTH_ENABLED']) {
            assert.equal(testConfig.vars[key], 'false', key + ' must remain disabled');
          }
          assert.equal(testConfig.vars.AGENT_PAUSED, 'true');
          assert.deepEqual(testConfig.durable_objects.bindings, [
            { name: 'AGENT_STATE_STORE', class_name: 'TestAgentStateStore' }
          ]);
          assert.deepEqual(testConfig.migrations, [
            { tag: 'fault-test-v1', new_sqlite_classes: ['TestAgentStateStore'] }
          ]);
          assert.equal(harness.includes('export class TestAgentStateStore extends AgentStateStore'), true);
          assert.equal(harness.includes('AGENT_FAULT_TEST_TOKEN'), true);
          assert.equal(harness.includes('env.AGENT_FAULT_TEST_TOKEN ?? env.AGENT_STATE_STORE_TOKEN'), true);
          assert.equal(harness.includes('"/__test/fault-suite"'), true);
          assert.match(workflow, /workflow_dispatch:/);
