name: Deploy exact candidate to isolated OAuth Preview

on:
  push:
    branches:
      - fix/restore-preview-migration-chain-20261111
    paths:
      - "worker.mjs"
      - "script.js"
      - "wrangler.jsonc"
      - "wrangler.preview-migrations.jsonc"
      - "migrations/**"
      - "scripts/test_auth_preview_oauth_http.mjs"
      - "scripts/test_email_relay_no_send.mjs"
      - ".github/workflows/deploy-auth-preview-candidate.yml"

permissions:
  contents: read

concurrency:
  group: isolated-auth-preview-candidate
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/fix/restore-preview-migration-chain-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "92cf091bbac8b4879ec65feb30b4715b"
      PREVIEW_WORKER_NAME: "ai-thuc-chien-blog-auth-app-preview"
      PREVIEW_D1_ID: "51d814c8-a3fc-4481-a5f1-60bc67617f3c"
      PREVIEW_D1_NAME: "ai-thuc-chien-community-preview"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate staging credentials are present (values remain masked)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          COMMUNITY_EMAIL_RELAY_URL: ${{ secrets.COMMUNITY_EMAIL_RELAY_URL }}
          COMMUNITY_EMAIL_RELAY_SECRET: ${{ secrets.COMMUNITY_EMAIL_RELAY_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN COMMUNITY_EMAIL_RELAY_URL COMMUNITY_EMAIL_RELAY_SECRET GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing required staging secret: $name"; exit 1; }
            echo "::add-mask::${!name}"
          done
          [[ "$PREVIEW_WORKER_NAME" == "ai-thuc-chien-blog-auth-app-preview" ]]
          [[ "$PREVIEW_D1_ID" == "51d814c8-a3fc-4481-a5f1-60bc67617f3c" ]]
          echo "PASS: staging-only credentials and hard-coded target identifiers are present."

      - name: Build candidate and validate JavaScript
        run: |
          npm run build
          node --check worker.mjs
          node --check script.js
          node --check scripts/test_auth_preview_oauth_http.mjs

      - name: Verify Preview D1 declaration differs from Production D1
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const prod = (config.d1_databases || []).find((item) => item.binding === 'DB');
          const preview = (config.previews?.d1_databases || []).find((item) => item.binding === 'DB');
          if (config.account_id !== process.env.CLOUDFLARE_ACCOUNT_ID ||
              config.name !== 'ai-thuc-chien-blog' ||
              !prod || !preview ||
              prod.database_id === preview.database_id ||
              preview.database_id !== process.env.PREVIEW_D1_ID ||
              preview.database_name !== process.env.PREVIEW_D1_NAME) {
            throw new Error('Safety stop: Wrangler configuration does not identify the expected isolated Preview D1.');
          }
          console.log('PASS: Production D1 and Preview D1 are distinct; Preview ID/name match the allowlisted target.');
          NODE

      - name: Verify exact remote Preview D1 identity (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/preview-d1.json"
          status="$(curl --silent --show-error --max-time 20 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            --output "$response" --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${PREVIEW_D1_ID}")"
          if [[ "$status" != "200" ]] || ! jq -e --arg id "$PREVIEW_D1_ID" --arg name "$PREVIEW_D1_NAME" \
            '.success == true and (.result.uuid == $id or .result.id == $id) and .result.name == $name' "$response" >/dev/null; then
            echo "::error::Cloudflare did not verify the exact Preview D1 target (HTTP ${status}); deployment stopped."
            jq -r '.errors[]?.message // empty' "$response" || true
            exit 1
          fi
          echo "PASS: exact remote Preview D1 identity verified."

      - name: List remote Preview migrations without applying SQL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations list "$PREVIEW_D1_NAME" --remote --config wrangler.preview-migrations.jsonc

      - name: Generate locked Preview-only Wrangler configuration
        shell: bash
        env:
          COMMUNITY_EMAIL_RELAY_URL: ${{ secrets.COMMUNITY_EMAIL_RELAY_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const prod = (c.d1_databases || []).find((item) => item.binding === 'DB');
          const preview = (c.previews?.d1_databases || []).find((item) => item.binding === 'DB');
          if (c.account_id !== process.env.CLOUDFLARE_ACCOUNT_ID ||
              c.name !== 'ai-thuc-chien-blog' || !prod || !preview ||
              prod.database_id === preview.database_id ||
              preview.database_id !== process.env.PREVIEW_D1_ID ||
              preview.database_name !== process.env.PREVIEW_D1_NAME) {
            throw new Error('Safety stop: unsafe Wrangler config; refusing Preview deploy.');
          }
          c.name = process.env.PREVIEW_WORKER_NAME;
          c.d1_databases = [{ ...preview, binding: 'DB' }];
          delete c.previews;
          c.vars = { ...(c.vars || {}), COMMUNITY_EMAIL_RELAY_URL: process.env.COMMUNITY_EMAIL_RELAY_URL };
          c.workers_dev = true;
          c.preview_urls = true;
          fs.writeFileSync('wrangler.auth-preview.jsonc', JSON.stringify(c, null, 2) + '\n', { mode: 0o600 });
          console.log('PASS: generated config contains only the dedicated Preview Worker and Preview D1.');
          NODE

      - name: Deploy candidate to the dedicated Preview Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy --config wrangler.auth-preview.jsonc --message "GitHub PR 102 isolated Preview candidate ${GITHUB_SHA}"

      - name: Verify relay connectivity without sending email
        env:
          COMMUNITY_EMAIL_RELAY_URL: ${{ secrets.COMMUNITY_EMAIL_RELAY_URL }}
          COMMUNITY_EMAIL_RELAY_SECRET: ${{ secrets.COMMUNITY_EMAIL_RELAY_SECRET }}
        run: node scripts/test_email_relay_no_send.mjs

      - name: Verify deployed Preview HTTP and OAuth transaction behavior
        env:
          PREVIEW_URL: "https://ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev"
        run: node scripts/test_auth_preview_oauth_http.mjs

      - name: Record explicit safety boundary
        if: always()
        run: |
          {
            echo "## Isolated Preview deployment"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Worker: ai-thuc-chien-blog-auth-app-preview"
            echo "- D1: ai-thuc-chien-community-preview (51d814c8-a3fc-4481-a5f1-60bc67617f3c)"
            echo "- Remote D1 migrations were listed only; no SQL migration was applied."
            echo "- No Production Worker, Production D1, DNS, or Production secrets were targeted."
            echo "- Relay check is an invalid-message no-send probe; no email is sent."
          } >> "$GITHUB_STEP_SUMMARY"
