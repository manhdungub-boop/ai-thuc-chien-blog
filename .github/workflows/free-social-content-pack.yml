name: Free social content draft pack

on:
  schedule:
    # Internal draft generation only; not a public posting time.
    - cron: "0 2 * * 3"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "feed.xml"
      - "scripts/generate-social-content-pack.mjs"
      - "scripts/simulate-social-publishing-schedule.mjs"
      - ".github/workflows/free-social-content-pack.yml"

permissions:
  contents: read

concurrency:
  group: free-social-content-pack
  cancel-in-progress: false

jobs:
  build-draft-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check script syntax and self-tests
        run: |
          node --check scripts/generate-social-content-pack.mjs
          node scripts/generate-social-content-pack.mjs --self-test
          node --check scripts/simulate-social-publishing-schedule.mjs
          node scripts/simulate-social-publishing-schedule.mjs --self-test

      - name: Generate social drafts from published RSS entries
        run: |
          node scripts/generate-social-content-pack.mjs --feed feed.xml --out reports/social/social-content-pack.md

      - name: Generate zero-slot schedule simulation until a social account is verified
        run: |
          node scripts/simulate-social-publishing-schedule.mjs --days 14 --out reports/social/social-publishing-schedule-simulation.md

      - name: Add draft and simulation summary to workflow run
        run: |
          {
            echo "## Free social content draft pack"
            echo
            echo "- Source: repository RSS only"
            echo "- Output: five newest published articles, or fewer if RSS contains fewer entries"
            echo "- Destination: internal draft only; no social network is connected to the Metricool brand, so no channel-specific destination is verified"
            echo "- Schedule: zero slots until a project social account is connected and verified; randomized-spacing algorithm is tested only with a synthetic TEST platform"
            echo "- No publishing, account access, external API, paid service, or secret access"
            echo "- The Wednesday workflow schedule is for internal draft generation only, not a public posting schedule"
            echo
            cat reports/social/social-content-pack.md
            echo
            cat reports/social/social-publishing-schedule-simulation.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve draft pack and schedule simulation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: free-social-content-pack-${{ github.run_id }}
          path: |
            reports/social/social-content-pack.md
            reports/social/social-publishing-schedule-simulation.md
          if-no-files-found: error
          retention-days: 14
