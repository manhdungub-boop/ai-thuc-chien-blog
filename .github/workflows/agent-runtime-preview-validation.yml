name: Agent Runtime Preview Shell Validation

on:
  push:
    branches: [fix/bounded-retention-cleanup-20261120]
    paths:
      - "agents/runtime/**"
      - ".github/workflows/agent-runtime-preview-validation.yml"
  pull_request:
    branches: [main, feat/agent-runtime-state-schema-v2-20261119, fix/state-store-bounded-json-schema-v5-20261120, fix/runtime-test-fixture-isolation-20261120, feat/operator-authenticated-task-recovery-20261120-v3, feat/runtime-readonly-observability-20261120, feat/operator-dead-letter-inspection-20261120]
    paths:
      - "agents/runtime/**"
      - ".github/workflows/agent-runtime-preview-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-preview-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pinned local Cloudflare runtime simulator with patched transitive dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/agent-runtime-audit"
          cat > "$RUNNER_TEMP/agent-runtime-audit/package.json" <<'JSON'
          {
            "private": true,
            "dependencies": {
              "miniflare": "4.20260730.0"
            },
            "overrides": {
              "miniflare": {
                "sharp": "0.35.5",
                "undici": "7.30.2"
              }
            }
          }
          JSON
          npm install --prefix "$RUNNER_TEMP/agent-runtime-audit" --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/agent-runtime-audit/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Report exact npm dependency advisories
        if: always()
        run: |
          npm audit --prefix "$RUNNER_TEMP/agent-runtime-audit" --json > "$RUNNER_TEMP/agent-runtime-npm-audit.json" || true
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.RUNNER_TEMP + '/agent-runtime-npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities ?? {};
          const totals = report.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify({
            totals,
            packages: Object.entries(vulnerabilities).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: (item.via ?? []).map(v => typeof v === 'string' ? { dependency: v } : ({
                title: v.title,
                url: v.url,
                range: v.range,
                source: v.source,
                cwe: v.cwe,
                cvss: v.cvss?.score
              }))
            }))
          }, null, 2));
          if ((totals.high ?? 0) > 0 || (totals.critical ?? 0) > 0) {
            throw new Error('High or critical dependency advisories remain in the isolated test dependency tree.');
          }
          NODE

      - name: Check syntax
        run: node --check agents/runtime/src/worker.mjs && node --check agents/runtime/src/state-store.mjs && node --check agents/runtime/src/lease-policy.mjs && node --check agents/runtime/src/internal-auth.mjs && node --check agents/runtime/src/github-oidc-verify.mjs

      - name: Assert test-only controls are absent from deployable State Store source
        run: |
          if grep -nE '__test/(downgrade-v1|rollback)|RUNTIME_TESTING|x-test-now' agents/runtime/src/state-store.mjs; then
            echo "Test-only routes or clock overrides must remain in the Miniflare fixture only."
            exit 1
          fi
          echo "PASS: deployable State Store source has no test-only routes or clock override."

      - name: Run isolated Worker shell and contract tests
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s node --test agents/runtime/tests/*.test.mjs

      - name: Verify preview config is isolated and has no execution triggers
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('agents/runtime/wrangler.jsonc', 'utf8'));
          assert.equal(config.name, 'ai-thuc-chien-agent-runtime-preview');
          assert.equal(config.workers_dev, true);
          assert.equal(config.preview_urls, true);
          assert.equal(config.vars.AGENT_ENABLED, 'false');
          assert.equal(config.vars.AGENT_PAUSED, 'true');
          assert.equal(JSON.stringify(config).includes('RUNTIME_TESTING'), false, 'test-only controls must not be deploy-configurable');
          assert.equal('routes' in config, false);
          assert.equal('d1_databases' in config, false);
          assert.equal('triggers' in config, false);
          assert.equal('queues' in config, false);
          assert.equal('durable_objects' in config, false);
          assert.equal('kv_namespaces' in config, false);
          assert.equal('r2_buckets' in config, false);
          console.log('PASS: isolated preview configuration; no production bindings, secrets, or schedules.');
          NODE

      - name: Assert workflow is validation-only
        run: |
          if grep -Eiq 'wrangler[[:space:]]+(deploy|versions[[:space:]]+upload)|CLOUDFLARE_[A-Z_]*TOKEN|secrets[.]' .github/workflows/agent-runtime-preview-validation.yml; then
            echo "Unexpected deployment or secret reference in validation workflow"
            exit 1
          fi
          echo "PASS: CI workflow contains no deployment command or Cloudflare secret."
