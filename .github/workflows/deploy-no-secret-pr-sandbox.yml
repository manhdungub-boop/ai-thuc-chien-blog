name: Deploy no-secret PR Sandbox

on:
  push:
    branches:
      - sync/gitlab-completed-work-20261107
    paths:
      - .github/workflows/deploy-no-secret-pr-sandbox.yml
  workflow_dispatch:
    inputs:
      source_commit_sha:
        description: "Exact 40-character commit SHA to test in the no-secret sandbox"
        required: true
        type: string
      confirm_sandbox_deploy:
        description: "Confirm deployment to ai-thuc-chien-blog-pr-sandbox only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: no-secret-pr-sandbox
  cancel-in-progress: false

jobs:
  deploy-no-secret-sandbox:
    if: github.ref == 'refs/heads/sync/gitlab-completed-work-20261107' && (github.event_name == 'push' || (inputs.confirm_sandbox_deploy == true && inputs.source_commit_sha != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted deployment workflow
        uses: actions/checkout@v4
        with:
          ref: sync/gitlab-completed-work-20261107
          persist-credentials: false

      - name: Validate source commit input
        shell: bash
        env:
          SOURCE_COMMIT_SHA: ${{ github.event_name == 'push' && 'f670d943b9521ec2698357b6566750fb24dfebb0' || inputs.source_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full 40-character commit SHA is required."; exit 1; }

      - name: Check out requested source commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'f670d943b9521ec2698357b6566750fb24dfebb0' || inputs.source_commit_sha }}
          path: sandbox-src
          persist-credentials: false
          clean: true

      - name: Build untrusted source without deployment credentials
        working-directory: sandbox-src
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check worker.mjs
          node scripts/build_static_site.cjs
          test -s dist/index.html
          test -s dist/404.html
          if find dist -type l -print -quit | grep -q .; then
            echo "::error::Symlinks are not allowed in the sandbox asset bundle."
            exit 1
          fi
          echo "PASS: source build completed without Cloudflare credentials or application secrets."

      - name: Install Wrangler before credentials are available
        run: npx --yes wrangler@4 --version

      - name: Generate fixed no-secret sandbox configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.pr-sandbox.jsonc <<'CONFIG'
          {
            "$schema": "https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json",
            "name": "ai-thuc-chien-blog-pr-sandbox",
            "account_id": "92cf091bbac8b4879ec65feb30b4715b",
            "main": "sandbox-src/worker.mjs",
            "compatibility_date": "2026-10-12",
            "compatibility_flags": ["assets_navigation_has_no_effect"],
            "workers_dev": true,
            "preview_urls": true,
            "keep_vars": false,
            "assets": {
              "directory": "sandbox-src/dist",
              "binding": "ASSETS",
              "html_handling": "none",
              "not_found_handling": "404-page",
              "run_worker_first": true
            },
            "ai": { "binding": "AI" },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "ai-thuc-chien-community-preview",
                "database_id": "51d814c8-a3fc-4481-a5f1-60bc67617f3c"
              }
            ]
          }
          CONFIG
          node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("wrangler.pr-sandbox.jsonc","utf8")); if(c.name!=="ai-thuc-chien-blog-pr-sandbox" || c.d1_databases[0].database_id!=="51d814c8-a3fc-4481-a5f1-60bc67617f3c" || c.secrets || c.vars || c.env) process.exit(1); console.log("PASS: fixed sandbox config contains no secret, relay URL, OAuth credential, or production D1 binding.");'

      - name: Deploy to the dedicated no-secret Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Missing scoped Preview deployment token."; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.pr-sandbox.jsonc --message "No-secret PR sandbox source ${{ github.event_name == 'push' && 'f670d943b9521ec2698357b6566750fb24dfebb0' || inputs.source_commit_sha }}"

      - name: Smoke-test sandbox homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://ai-thuc-chien-blog-pr-sandbox.manhdungub.workers.dev/ \
            --output "$RUNNER_TEMP/sandbox-home.html"
          grep -qi '<html' "$RUNNER_TEMP/sandbox-home.html"
          echo "PASS: no-secret sandbox homepage returned HTML."

      - name: Record isolation boundary
        if: always()
        run: |
          {
            echo "## No-secret PR Sandbox"
            echo "- Worker: ai-thuc-chien-blog-pr-sandbox"
            echo "- Source commit: ${{ github.event_name == 'push' && 'f670d943b9521ec2698357b6566750fb24dfebb0' || inputs.source_commit_sha }}"
            echo "- D1: dedicated non-production Preview D1 only"
            echo "- No email relay URL/secret or Google OAuth credentials were supplied."
            echo "- No Production Worker, Production D1, DNS, or secret mutation was performed."
          } >> "$GITHUB_STEP_SUMMARY"
