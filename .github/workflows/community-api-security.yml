name: Community API Bounded Body Security Tests

on:
  pull_request:
    paths:
      - "worker.mjs"
      - "scripts/test_community_api.mjs"
      - ".github/workflows/community-api-security.yml"

permissions:
  contents: read

concurrency:
  group: community-api-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  community-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.mjs
      - name: Test Community API security and behavior
        run: node scripts/test_community_api.mjs
