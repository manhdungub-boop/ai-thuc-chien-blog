name: Deploy Agent Runtime Preview (Manual Only)

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: "Confirm deployment to the isolated Agent Runtime Preview only. The Agent remains disabled and paused; no task execution or Production access is enabled."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-thuc-chien-agent-runtime-preview-deploy
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (github.ref == 'refs/heads/feat/agent-runtime-preview-shell-20261119' ||
           github.ref == 'refs/heads/fix/agent-authoring-revision-queue-20261120' ||
           github.ref == 'refs/heads/feat/reviewer-authoring-evidence-flow-20261120' ||
           github.ref == 'refs/heads/security/preview-deploy-branch-gate-20261120') &&
          inputs.confirm_preview_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "92cf091bbac8b4879ec65feb30b4715b"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Require a dedicated least-privilege Preview token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_AGENT_PREVIEW_API_TOKEN. Add a dedicated token scoped only to the isolated Preview Worker. Never reuse the Production deployment token."
            exit 1
          fi

      - name: Install isolated pinned Miniflare test dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-runtime-audit"
          cat > "$RUNNER_TEMP/agent-runtime-audit/package.json" <<'JSON'
          {
            "private": true,
            "dependencies": {
              "miniflare": "4.20260730.0"
            },
            "overrides": {
              "miniflare": {
                "sharp": "0.35.5",
                "undici": "7.30.2"
              }
            }
          }
          JSON
          npm install --prefix "$RUNNER_TEMP/agent-runtime-audit" --ignore-scripts --no-audit --no-fund
          ln -s "$RUNNER_TEMP/agent-runtime-audit/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Verify isolated test dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          npm audit --prefix "$RUNNER_TEMP/agent-runtime-audit" --json > "$RUNNER_TEMP/agent-runtime-audit.json" || true
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/agent-runtime-audit.json", "utf8"));
          const totals = report.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify({ totals }, null, 2));
          if ((totals.high ?? 0) > 0 || (totals.critical ?? 0) > 0) {
            throw new Error("High or critical advisory remains in the isolated Runtime test dependency tree.");
          }
          NODE

      - name: Validate Runtime source and local contracts
        run: |
          set -euo pipefail
          node --check agents/runtime/src/worker.mjs
          node --check agents/runtime/src/state-store.mjs
          node --check agents/runtime/src/internal-auth.mjs
          node --check agents/runtime/src/state-store-client.mjs
          node --test agents/runtime/tests/*.test.mjs

      - name: Validate isolated paused Worker configuration
        run: |
          set -euo pipefail
          npx --yes wrangler@4 types --config agents/runtime/wrangler.jsonc
          npx --yes wrangler@4 deploy --dry-run --config agents/runtime/wrangler.jsonc

      - name: Deploy isolated Agent Runtime Preview only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AGENT_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config agents/runtime/wrangler.jsonc 2>&1 | tee "$RUNNER_TEMP/agent-runtime-preview-deploy.log"
          worker_url="$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/agent-runtime-preview-deploy.log" | tail -n 1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "::error::Wrangler did not report a workers.dev URL; refusing to claim a successful health check."
            exit 1
          fi
          printf '%s\n' "$worker_url" > "$RUNNER_TEMP/agent-runtime-preview-url.txt"

      - name: Verify Preview health remains disabled and paused
        shell: bash
        run: |
          set -euo pipefail
          worker_url="$(cat "$RUNNER_TEMP/agent-runtime-preview-url.txt")"
          curl --fail --silent --show-error --max-time 20 "$worker_url/health" -o "$RUNNER_TEMP/agent-runtime-preview-health.json"
          jq -e '
            .ok == true and
            .service == "ai-thuc-chien-agent-runtime-preview" and
            .enabled == false and
            .paused == true and
            .execution == "not_implemented"
          ' "$RUNNER_TEMP/agent-runtime-preview-health.json" >/dev/null
          {
            echo "## Agent Runtime Preview"
            echo "- Preview URL: $worker_url"
            echo "- Health: PASS"
            echo "- Agent execution: disabled and paused"
            echo "- No cron, queue, D1, KV, R2, Durable Object, route, or Production binding is configured"
            echo "- Production Worker/D1/DNS access: none"
          } >> "$GITHUB_STEP_SUMMARY"
