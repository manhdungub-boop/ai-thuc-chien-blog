name: Validate and package approved content (no Production deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - "articles/*.html"
      - "data/ai-tools.json"
      - "index.html"
      - "thu-vien.html"
      - "ngan-hang-ai.html"
      - "sitemap.xml"
      - "feed.xml"
  push:
    branches: [main]
    paths:
      - "articles/*.html"
      - "data/ai-tools.json"
      - "index.html"
      - "thu-vien.html"
      - "ngan-hang-ai.html"
      - "sitemap.xml"
      - "feed.xml"

permissions:
  contents: read

concurrency:
  group: content-validation-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision and comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce content-only change boundary
        shell: bash
        env:
          BEFORE_SHA: \${{ github.event.before || github.event.pull_request.base.sha }}
          AFTER_SHA: \${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "::error::Cannot verify the comparison base; refusing to package content."
            exit 1
          fi
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          if [[ -z "$changed_files" ]]; then
            echo "::error::No changed files found; refusing to package content."
            exit 1
          fi
          printf '%s\n' "$changed_files"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              articles/*.html|data/ai-tools.json|index.html|thu-vien.html|ngan-hang-ai.html|sitemap.xml|feed.xml) ;;
              *)
                echo "::error::Blocked non-content file in content package: $path"
                exit 1
                ;;
            esac
          done <<< "$changed_files"
          echo "PASS: only approved public content files changed."

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run article quality and SEO checks
        run: |
          npm run test:content
          npm run test:seo

      - name: Validate AI Bank catalog and official evidence
        run: |
          node scripts/validate-ai-tools-catalog.mjs data/ai-tools.json
          node scripts/audit-ai-tools-catalog.mjs data/ai-tools.json docs/reviews/ai-tools-candidates-2026-11-02.json --strict
          node scripts/check-ai-tools-links.mjs data/ai-tools.json

      - name: Build static site and validate Worker package without deploying
        run: |
          npm run build
          npx --yes wrangler@4.151.3 deploy --dry-run --config wrangler.jsonc
          test -d dist
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/feed.xml
          test -f dist/data/ai-tools.json

      - name: Package reviewed public content for a separately approved release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reviewed-content-\${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Record the no-deployment boundary
        run: |
          {
            echo "## Content validation and package"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Event: \`$GITHUB_EVENT_NAME\`"
            echo "- Quality, SEO, AI Bank validation, build, and Wrangler dry-run completed before artifact creation."
            echo "- The reviewed static output is retained as a GitHub Actions artifact for 14 days."
            echo "- This workflow does not deploy Cloudflare Workers or Pages, access D1, modify DNS, or use Cloudflare deployment secrets."
            echo "- Public release remains a separate, explicitly approved operation."
          } >> "$GITHUB_STEP_SUMMARY"
