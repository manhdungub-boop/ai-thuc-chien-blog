name: Manage Preview D1 Migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list shows migration state only; apply migrates the verified preview database only"
        type: choice
        options: [list, apply]
        default: list
        required: true

permissions:
  contents: read

concurrency:
  group: preview-d1-migrations
  cancel-in-progress: false

jobs:
  preview-d1:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 92cf091bbac8b4879ec65feb30b4715b
    steps:
      - name: Check out selected feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact preview database target (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_WORKERS_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_WORKERS_API_TOKEN is required."
            exit 1
          fi
          echo "::add-mask::${CLOUDFLARE_WORKERS_API_TOKEN}"
          config_json="$(node <<'NODE'
          const fs = require('node:fs');
          const base = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const migrations = JSON.parse(fs.readFileSync('wrangler.preview-migrations.jsonc', 'utf8'));
          const prod = (base.d1_databases || []).find(x => x.binding === 'DB');
          const preview = ((base.previews || {}).d1_databases || []).find(x => x.binding === 'DB');
          const targets = migrations.d1_databases || [];
          if (!prod || !preview || targets.length !== 1) throw new Error('Expected one production DB, one preview DB and one preview migration target.');
          const target = targets[0];
          if (base.account_id !== migrations.account_id) throw new Error('Preview migration account does not match Worker account.');
          if (prod.database_id === preview.database_id || prod.database_name === preview.database_name) throw new Error('Preview DB must be distinct from production.');
          if (preview.database_id !== target.database_id || preview.database_name !== target.database_name || target.binding !== 'PREVIEW_DB' || target.migrations_dir !== 'migrations') {
            throw new Error('Preview migration target does not exactly match the Worker preview database.');
          }
          if (preview.database_id !== '51d814c8-a3fc-4481-a5f1-60bc67617f3c' || preview.database_name !== 'ai-thuc-chien-community-preview') {
            throw new Error('Preview database identity differs from the independently verified target; refusing to continue.');
          }
          process.stdout.write(JSON.stringify({id: preview.database_id, name: preview.database_name}));
          NODE
          )"
          PREVIEW_D1_ID="$(jq -r '.id' <<< "$config_json")"
          PREVIEW_D1_NAME="$(jq -r '.name' <<< "$config_json")"
          response="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_WORKERS_API_TOKEN}" -o "$response" -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${PREVIEW_D1_ID}" || true)"
          if [[ "$status" != "200" ]] || ! jq -e --arg id "$PREVIEW_D1_ID" --arg name "$PREVIEW_D1_NAME" '.success == true and (.result.uuid == $id or .result.id == $id) and .result.name == $name' "$response" >/dev/null; then
            echo "::error::Cloudflare did not verify the exact preview D1 target (HTTP ${status}); no migration was run."
            jq -r '(.errors[]?.message // empty)' "$response" 2>/dev/null || true
            rm -f "$response"
            exit 1
          fi
          rm -f "$response"
          echo "PASS: verified separate preview D1 database. No SQL has been executed."

      - name: List current preview migrations (read-only)
        run: npx --yes wrangler@4 d1 migrations list "ai-thuc-chien-community-preview" --remote --config wrangler.preview-migrations.jsonc

      - name: Apply pending migrations to preview D1 only
        if: inputs.mode == 'apply'
        run: npx --yes wrangler@4 d1 migrations apply "ai-thuc-chien-community-preview" --remote --config wrangler.preview-migrations.jsonc

      - name: Confirm preview migration state after apply
        if: inputs.mode == 'apply'
        run: npx --yes wrangler@4 d1 migrations list "ai-thuc-chien-community-preview" --remote --config wrangler.preview-migrations.jsonc
