name: Deploy Cloudflare Workers (Preview only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-thuc-chien-blog-preview-worker
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "92cf091bbac8b4879ec65feb30b4715b"
    steps:
      - name: Checkout selected feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate exact Preview-only target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::CLOUDFLARE_WORKERS_API_TOKEN is missing."; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path("wrangler.preview.jsonc").read_text())
          assert c["name"] == "ai-thuc-chien-blog-auth-app-preview"
          assert c["account_id"] == "92cf091bbac8b4879ec65feb30b4715b"
          db = c["d1_databases"]
          assert len(db) == 1
          assert db[0]["binding"] == "DB"
          assert db[0]["database_name"] == "ai-thuc-chien-community-preview"
          assert db[0]["database_id"] == "51d814c8-a3fc-4481-a5f1-60bc67617f3c"
          assert db[0]["database_id"] != "fc2517cb-9543-4d7b-98f4-bcd5f3c013e7"
          assert c["assets"]["directory"] == "./dist"
          assert c["assets"]["binding"] == "ASSETS"
          assert c["keep_vars"] is True
          assert "secrets" in c and len(c["secrets"]["required"]) == 3
          print("PASS: Preview Worker and Preview D1 IDs pinned; Production D1 is excluded.")
          PY

      - name: Build assets and run local regression suite
        run: |
          set -euo pipefail
          npm run build
          node --check worker.mjs
          node --check script.js
          node scripts/test_worker_headers.mjs
          node scripts/test_community_api.mjs
          python3 scripts/test_community_schema.py

      - name: Inspect Preview D1 migration state (read-only)
        run: npx --yes wrangler@4 d1 migrations list "ai-thuc-chien-community-preview" --remote --config wrangler.preview.jsonc

      - name: Deploy to isolated Preview Worker only
        run: npx --yes wrangler@4 deploy --config wrangler.preview.jsonc

      - name: Verify Preview pages, reset UI, API, and security headers
        shell: bash
        run: |
          set -euo pipefail
          host="https://ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev"
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          status="$(curl --silent --show-error --location --max-time 25 -D "$headers" -o "$body" -w '%{http_code}' "$host/")"
          [[ "$status" == "200" ]] || { echo "Preview homepage returned HTTP $status"; exit 1; }
          for expected in 'X-Content-Type-Options: nosniff' 'X-Frame-Options: DENY' 'Referrer-Policy: strict-origin-when-cross-origin' 'Strict-Transport-Security: max-age=31536000'; do
            grep -Fqi "$expected" "$headers" || { echo "Missing Preview security header: $expected"; exit 1; }
          done
          grep -q 'community-forgot-password' "$body" || { echo "Preview reset-request UI is missing."; exit 1; }
          me_status="$(curl --silent --show-error --max-time 20 -o /tmp/community-me.json -w '%{http_code}' "$host/api/community/me")"
          [[ "$me_status" == "200" ]] || { echo "Preview /api/community/me returned HTTP $me_status"; exit 1; }
          reset_status="$(curl --silent --show-error --max-time 20 -H "Origin: $host" -H 'Content-Type: application/json' -d '{"email":"not-a-real-member@example.invalid"}' -o /tmp/community-reset.json -w '%{http_code}' "$host/api/community/password-reset/request")"
          [[ "$reset_status" == "200" ]] || { echo "Preview password-reset request returned HTTP $reset_status"; exit 1; }
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync("/tmp/community-reset.json","utf8")); if(x.ok!==true || !String(x.message||"").includes("Nếu email này có tài khoản hợp lệ")) process.exit(1);'
          echo "PASS: Preview UI, reset route, member endpoint, and security headers verified."
