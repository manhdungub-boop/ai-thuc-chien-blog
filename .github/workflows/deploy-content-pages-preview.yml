name: Verify exact Cloudflare Preview without secrets
# Static content-only diffs use Pages branch Preview; code/assets diffs still require Worker Preview.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, fix/content-pages-preview-verifier-20261126]
    paths:
      - "articles/**"
      - "index.html"
      - "thu-vien.html"
      - "ngan-hang-ai.html"
      - "sitemap.xml"
      - "feed.xml"
      - "styles.css"
      - "script.js"
      - "data/ai-tools.json"
      - "images/**"
      - "illustrations/**"
      - ".github/workflows/deploy-content-pages-preview.yml"
      - ".github/workflows/auto-publish-articles.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: worker-preview-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'fix/content-pages-preview-verifier-20261126')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Determine exact Preview mode from changed files
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          files_file="$(mktemp)"
          trap 'rm -f "$files_file"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            -o "$files_file"
          preview_mode="$(FILES_FILE="$files_file" python3 - <<'PY'
          import json, os
          with open(os.environ["FILES_FILE"], encoding="utf-8") as stream:
              files = json.load(stream)
          workflow_only = {
              ".github/workflows/auto-publish-articles.yml",
              ".github/workflows/deploy-content-pages-preview.yml",
          }
          content_only_exact = {
              "data/ai-tools.json", "index.html", "thu-vien.html",
              "ngan-hang-ai.html", "sitemap.xml", "feed.xml",
          }
          # GitHub caps this endpoint at 100 files per page. A capped or
          # potentially incomplete list must fail closed to Worker Preview.
          if len(files) >= 100:
              print("workers")
              raise SystemExit(0)
          changed = set()
          for item in files:
              changed.add(item.get("filename", ""))
              previous_filename = item.get("previous_filename")
              if previous_filename:
                  changed.add(previous_filename)
          is_article = lambda path: path.startswith("articles/") and path.endswith(".html") and path.count("/") == 1
          if changed and changed.issubset(workflow_only):
              print("none")
          elif changed and all(path in content_only_exact or is_article(path) for path in changed):
              print("pages")
          else:
              print("workers")
          PY
          )"
          echo "preview_mode=$preview_mode" >> "$GITHUB_OUTPUT"
          case "$preview_mode" in
            none)
              echo "PASS: workflow-only PR; application Preview is not applicable."
              echo "Application source, public content and assets are unchanged; only the reviewed release-control workflow changed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            pages)
              echo "Static content-only PR; exact-head Cloudflare Pages branch Preview verification is required."
              ;;
            workers)
              echo "Application code/assets changed; exact-head dedicated Worker Preview verification is required."
              ;;
          esac

      - name: Wait for the exact-head Cloudflare Pages branch Preview
        if: steps.scope.outputs.preview_mode == 'pages'
        id: pages_resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          checks_file="$(mktemp)"
          trap 'rm -f "$checks_file"' EXIT
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" \
              -o "$checks_file"
            preview_url="$(EXPECTED_SHA="$EXPECTED_SHA" CHECKS_FILE="$checks_file" python3 - <<'PY'
          import json, os, re
          expected = os.environ["EXPECTED_SHA"]
          with open(os.environ["CHECKS_FILE"], encoding="utf-8") as stream:
              checks = json.load(stream).get("check_runs", [])
          for check in checks:
              if check.get("name") != "Cloudflare Pages":
                  continue
              if check.get("head_sha") != expected or check.get("status") != "completed" or check.get("conclusion") != "success":
                  continue
              summary = check.get("output", {}).get("summary") or ""
              if expected[:7] not in summary:
                  continue
              match = re.search(
                  r"Branch Preview URL:</strong>.*?<a href=['\"](https://[a-z0-9-]+\.ai-thuc-chien-blog\.pages\.dev)['\"]",
                  summary,
                  re.S,
              )
              if match:
                  print(match.group(1))
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          )" || true
            if [[ -n "$preview_url" ]]; then
              echo "url=$preview_url" >> "$GITHUB_OUTPUT"
              echo "PASS: Cloudflare Pages branch Preview is deployed for exact commit ${EXPECTED_SHA:0:7}."
              exit 0
            fi
            echo "Waiting for exact-head Cloudflare Pages Preview (attempt $attempt/24; commit ${EXPECTED_SHA:0:7})."
            sleep 10
          done
          echo "::error::No successful exact-head Cloudflare Pages branch Preview URL appeared within four minutes."
          exit 1

      - name: Wait for the exact-head Cloudflare Workers Preview deployment record
        if: steps.scope.outputs.preview_mode == 'workers'
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          comments_file="$(mktemp)"
          checks_file="$(mktemp)"
          trap 'rm -f "$comments_file" "$checks_file"' EXIT
          short_sha="${EXPECTED_SHA:0:7}"
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" \
              -o "$checks_file"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              -o "$comments_file"

            preview_url="$(EXPECTED_SHA="$EXPECTED_SHA" COMMENTS_FILE="$comments_file" CHECKS_FILE="$checks_file" python3 - <<'PY'
          import json, os, re
          from html.parser import HTMLParser

          class PreviewTableParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.rows = []
                  self.row = None
                  self.cell = None
                  self.href = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "tr":
                      self.row = []
                  elif tag == "td" and self.row is not None:
                      self.cell = []
                      self.href = None
                  elif tag == "a" and self.cell is not None and self.href is None:
                      self.href = attrs.get("href")

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag == "td" and self.cell is not None:
                      self.row.append((" ".join("".join(self.cell).split()), self.href))
                      self.cell = None
                      self.href = None
                  elif tag == "tr" and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None

          expected = os.environ["EXPECTED_SHA"]
          branch = os.environ["HEAD_REF"]
          with open(os.environ["CHECKS_FILE"], encoding="utf-8") as stream:
              checks = json.load(stream).get("check_runs", [])
          cloudflare = [
              check for check in checks
              if check.get("name", "").startswith("Workers Builds:")
          ]
          if not any(
              check.get("status") == "completed" and check.get("conclusion") == "success"
              for check in cloudflare
          ):
              raise SystemExit(1)

          with open(os.environ["COMMENTS_FILE"], encoding="utf-8") as stream:
              comments = json.load(stream)
          bot_comments = [
              comment.get("body") or ""
              for comment in comments
              if comment.get("user", {}).get("login") == "cloudflare-workers-and-pages[bot]"
          ]
          for body in reversed(bot_comments):
              if f"(commit {expected[:7]})" not in body:
                  continue
              parser = PreviewTableParser()
              parser.feed(body)
              for row in parser.rows:
                  if len(row) < 3 or row[2][0].strip() != expected[:7]:
                      continue
                  url = row[1][1]
                  if url and re.fullmatch(
                      r"https://[a-f0-9]{8}-ai-thuc-chien-blog-auth-app-preview\.manhdungub\.workers\.dev",
                      url
                  ):
                      print(url)
                      raise SystemExit(0)

          # Cloudflare's stable branch Preview alias can be updated before its
          # PR comment's per-commit deployment table. Only use it after GitHub
          # reports a successful Workers Builds check on this exact commit.
          for body in reversed(bot_comments):
              match = re.search(
                  r"### Preview URL: (https://[a-z0-9-]+-ai-thuc-chien-blog-auth-app-preview\.manhdungub\.workers\.dev)",
                  body
              )
              if match:
                  print(match.group(1))
                  raise SystemExit(0)

          # Cloudflare's bot comment may retain an "in progress" row after the
          # exact-SHA Workers Builds check succeeds. Its details URL contains
          # the Preview slug. Derive the stable alias only from that successful
          # exact-head check; route and security-header probes remain mandatory.
          for check in cloudflare:
              if check.get("status") != "completed" or check.get("conclusion") != "success":
                  continue
              details_url = check.get("details_url") or ""
              match = re.search(
                  r"/production/previews/([a-z0-9-]+)/builds/[0-9a-f-]+/?$",
                  details_url
              )
              if match:
                  slug = match.group(1)
              elif re.search(r"/production/builds/[0-9a-f-]+/?$", details_url):
                  # Preview builds created by a branch-specific Preview trigger
                  # use the first 27 characters of the normalized branch name
                  # as the stable alias. The check name is already restricted
                  # to the dedicated Preview Worker above; HTTP and header
                  # probes below remain mandatory.
                  slug = re.sub(r"-+", "-", re.sub(r"[^a-z0-9-]+", "-", branch.lower())).strip("-")[:27].rstrip("-")
              else:
                  continue
              if slug:
                  print(
                      "https://"
                      + slug
                      + "-ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev"
                  )
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          )" || true

            if [[ -n "$preview_url" ]]; then
              echo "url=$preview_url" >> "$GITHUB_OUTPUT"
              echo "PASS: Cloudflare Workers Builds succeeded for exact commit $short_sha; resolved its branch Preview URL."
              exit 0
            fi
            echo "Waiting for the exact-head Cloudflare build and Preview URL (attempt $attempt/24; commit $short_sha)."
            sleep 10
          done
          echo "::error::No successful exact-head Cloudflare Workers Preview build and resolvable Preview URL appeared within four minutes."
          exit 1

      - name: Verify public content and discovery routes on exact-head Preview
        if: steps.scope.outputs.preview_mode != 'none'
        shell: bash
        env:
          BASE_URL: ${{ steps.pages_resolve.outputs.url || steps.resolve.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /thu-vien.html /ngan-hang-ai.html /sitemap.xml /feed.xml /data/ai-tools.json /articles/mcp-filesystem-server-an-toan; do
            code="$(curl --silent --show-error --location --max-time 20 -o /dev/null -w '%{http_code}' "$BASE_URL$path")"
            if [[ "$code" != "200" ]]; then
              echo "::error::Exact-head Preview route $path returned HTTP $code"
              exit 1
            fi
            echo "PASS: $path returned HTTP 200"
          done

          library="$(curl --fail --silent --show-error --location --max-time 20 "$BASE_URL/thu-vien.html")"
          if ! grep -Eq '[0-9]+[[:space:]]+bài' <<< "$library"; then
            echo "::error::Exact-head Preview library does not display an article count."
            exit 1
          fi
          echo "PASS: exact-head Preview library displays an article count."

          catalog="$(curl --fail --silent --show-error --location --max-time 20 "$BASE_URL/data/ai-tools.json")"
          if ! grep -q '"tools"' <<< "$catalog"; then
            echo "::error::Exact-head Preview AI Bank JSON is missing the tools collection."
            exit 1
          fi
          echo "PASS: exact-head Preview AI Bank JSON is readable."

      - name: Verify security headers on exact-head Worker Preview
        if: steps.scope.outputs.preview_mode != 'none'
        shell: bash
        env:
          BASE_URL: ${{ steps.pages_resolve.outputs.url || steps.resolve.outputs.url }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          curl --fail --silent --show-error --location --max-time 20 -D "$headers" -o /dev/null "$BASE_URL/"
          for expected in \
            'X-Content-Type-Options: nosniff' \
            'X-Frame-Options: DENY' \
            'Referrer-Policy: strict-origin-when-cross-origin' \
            'Strict-Transport-Security: max-age=31536000'; do
            grep -Fqi "$expected" "$headers" || {
              echo "::error::Exact-head Preview is missing security header: $expected"
              exit 1
            }
          done
          echo "PASS: required security headers are present on exact-head Preview."
