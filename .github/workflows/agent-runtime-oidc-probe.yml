name: Agent Runtime Real GitHub OIDC Probe

on:
  push:
    branches:
      - audit/oidc-real-token-probe-20261120

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-runtime-real-oidc-probe
  cancel-in-progress: true

jobs:
  inspect-real-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Request and verify a real GitHub-issued OIDC token without exposing it
        env:
          EXPECTED_AUDIENCE: ai-thuc-chien-agent-runtime-preview
          EXPECTED_REPOSITORY: manhdungub-boop/ai-thuc-chien-blog
          EXPECTED_REPOSITORY_ID: "1423636651"
          EXPECTED_OWNER: manhdungub-boop
          EXPECTED_OWNER_ID: "342528485"
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_ACTOR_ID: ${{ github.actor_id }}
          EXPECTED_EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { fetchGitHubActionsJwks } from './agents/runtime/src/github-oidc-jwks.mjs';

          const issuer = 'https://token.actions.githubusercontent.com';
          const audience = process.env.EXPECTED_AUDIENCE;
          assert.ok(process.env.ACTIONS_ID_TOKEN_REQUEST_URL, 'GitHub OIDC request URL missing');
          assert.ok(process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN, 'GitHub OIDC request credential missing');

          const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          requestUrl.searchParams.set('audience', audience);
          const tokenResponse = await fetch(requestUrl, {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
            redirect: 'error',
            cache: 'no-store',
          });
          assert.equal(tokenResponse.status, 200, 'GitHub OIDC token request failed');
          const tokenPayload = await tokenResponse.json();
          const token = tokenPayload.value;
          assert.equal(typeof token, 'string', 'GitHub OIDC token response malformed');

          const parts = token.split('.');
          assert.equal(parts.length, 3, 'JWT must contain exactly three segments');
          const decode = (part) => JSON.parse(Buffer.from(part, 'base64url').toString('utf8'));
          const header = decode(parts[0]);
          const claims = decode(parts[1]);
          assert.equal(header.alg, 'RS256');
          assert.equal(header.typ, 'JWT');
          assert.equal(typeof header.kid, 'string');

          const jwks = await fetchGitHubActionsJwks();
          const matches = jwks.keys.filter((key) => key.kid === header.kid);
          assert.equal(matches.length, 1, 'GitHub signing key must match exactly once');
          const publicKey = await crypto.subtle.importKey(
            'jwk', matches[0],
            { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
            false, ['verify'],
          );
          const signature = Buffer.from(parts[2], 'base64url');
          const signingInput = new TextEncoder().encode(parts[0] + '.' + parts[1]);
          assert.equal(
            await crypto.subtle.verify('RSASSA-PKCS1-v1_5', publicKey, signature, signingInput),
            true,
            'GitHub OIDC JWT signature invalid',
          );

          const expected = {
            iss: issuer,
            aud: audience,
            repository: process.env.EXPECTED_REPOSITORY,
            repository_owner: process.env.EXPECTED_OWNER,
            repository_id: process.env.EXPECTED_REPOSITORY_ID,
            repository_owner_id: process.env.EXPECTED_OWNER_ID,
            ref: process.env.EXPECTED_REF,
            workflow_ref: process.env.EXPECTED_WORKFLOW_REF,
            actor_id: process.env.EXPECTED_ACTOR_ID,
            event_name: process.env.EXPECTED_EVENT_NAME,
          };
          for (const [key, value] of Object.entries(expected)) {
            assert.equal(String(claims[key] ?? ''), value, 'OIDC claim mismatch: ' + key);
          }
          const expectedSub = 'repo:' + expected.repository_owner + '@' + expected.repository_owner_id + '/' +
            expected.repository.split('/')[1] + '@' + expected.repository_id + ':ref:' + expected.ref;
          assert.equal(claims.sub, expectedSub, 'immutable repository subject mismatch');
          assert.ok(typeof claims.jti === 'string' && claims.jti.length > 0, 'OIDC jti missing');
          assert.ok(Number.isSafeInteger(claims.iat) && Number.isSafeInteger(claims.exp), 'OIDC time claims invalid');
          assert.ok(claims.exp > Math.floor(Date.now() / 1000), 'OIDC token already expired');
          assert.ok(typeof claims.run_id === 'string' && /^\d+$/.test(claims.run_id), 'run_id missing');
          assert.ok(typeof claims.run_attempt === 'string' && /^\d+$/.test(claims.run_attempt), 'run_attempt missing');

          // Print only non-secret identity claims. Never print the JWT, request URL, or request credential.
          console.log(JSON.stringify({
            verified: true,
            signature: 'valid RS256 / GitHub-pinned JWKS',
            claims: {
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              repository_id: claims.repository_id,
              repository_owner: claims.repository_owner,
              repository_owner_id: claims.repository_owner_id,
              ref: claims.ref,
              workflow_ref: claims.workflow_ref,
              event_name: claims.event_name,
              actor_id: claims.actor_id,
              run_id: claims.run_id,
              run_attempt: claims.run_attempt,
            },
            token: 'not logged',
            replay_store: 'not called',
            state_changes: 'none',
          }, null, 2));
          NODE
