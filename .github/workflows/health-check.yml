name: Verify Website Health

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js for browser-script regression tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test homepage search behavior
        run: |
          node --check script.js
          node scripts/test_homepage_search.cjs

      - name: Test contextual article navigation
        run: node scripts/test_article_navigation.cjs

      - name: Validate HTML metadata and sitemap
        run: |
          python - <<'PY'
          import json, re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          worker_config = json.loads(Path("wrangler.jsonc").read_text(encoding="utf-8"))
          assert worker_config.get("name") == "ai-thuc-chien-blog", "Worker deploy target must be the existing production Worker"
          assert worker_config.get("assets", {}).get("directory") == "./dist", "Worker must deploy the prepared dist directory"
          assert "main" not in worker_config, "This site is static-only; do not add a Worker code entrypoint accidentally"
          print("Worker deployment config PASS: production target and static-only assets")

          header_policy = Path("_headers").read_text(encoding="utf-8")
          for required_header in (
              "X-Content-Type-Options: nosniff",
              "X-Frame-Options: DENY",
              "Referrer-Policy: strict-origin-when-cross-origin",
              "Permissions-Policy: camera=(), geolocation=(), microphone=(), payment=()",
              "Strict-Transport-Security: max-age=31536000",
          ):
              assert required_header in header_policy, f"_headers: missing security policy {required_header}"
          print("SECURITY HEADER POLICY PASS: baseline browser protections are present")

          article_paths = sorted(Path("articles").glob("*.html"))
          assert article_paths, "expected at least one article HTML file"
          pages = [Path("index.html"), Path("ve-chung-toi.html"), *article_paths]
          for path in pages:
              text = path.read_text(encoding="utf-8")
              assert re.search(r"<title>\s*.+?\s*</title>", text, re.I | re.S), f"{path}: missing title"
              assert re.search(r'<meta name="description" content="[^"]+"', text, re.I), f"{path}: missing description"
              assert len(re.findall(r"<h1\b", text, re.I)) == 1, f"{path}: expected exactly one H1"
              assert len(re.findall(r'<link rel="canonical" href="[^"]+"', text, re.I)) == 1, f"{path}: expected one canonical"
              body = re.sub(r"<head\b.*?</head>", "", text, flags=re.I | re.S)
              visible_body = re.sub(r"<script\b.*?</script>|<style\b.*?</style>", "", body, flags=re.I | re.S)
              visible_body = re.sub(r"<[^>]+>", " ", visible_body)
              assert "ai-thuc-chien-blog.manhdungub.workers.dev/articles/" not in visible_body, f"{path}: production article URL leaked into visible copy"
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, re.I | re.S):
                  json.loads(block)
              print(f"SEO/HTML PASS: {path}")

          from collections import Counter
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit
          import posixpath

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "a" and attrs.get("href") is not None:
                      self.hrefs.append(attrs["href"])
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])

          link_pages = pages + [Path("404.html")]
          parsed_pages = {}
          for path in link_pages:
              parser = LinkParser()
              parser.feed(path.read_text(encoding="utf-8"))
              duplicates = [value for value, count in Counter(parser.ids).items() if count > 1]
              assert not duplicates, f"{path}: duplicate HTML IDs: {duplicates}"
              parsed_pages[str(path)] = {"parser": parser, "ids": set(parser.ids)}

          checked_links = 0
          for source_path in link_pages:
              parser = parsed_pages[str(source_path)]["parser"]
              for href in parser.hrefs:
                  target_url = urlsplit(href)
                  if target_url.scheme or target_url.netloc or href.startswith("//"):
                      continue
                  local_path = unquote(target_url.path)
                  if not local_path:
                      destination = str(source_path)
                  else:
                      if local_path.startswith("/"):
                          candidate = local_path.lstrip("/")
                      else:
                          candidate = posixpath.join(posixpath.dirname(str(source_path)), local_path)
                      if local_path.endswith("/") or candidate in ("", "."):
                          candidate = posixpath.join(candidate, "index.html")
                      destination = posixpath.normpath(candidate)
                      if destination == "ve-chung-toi":
                          destination += ".html"
                      elif destination.startswith("articles/") and not posixpath.splitext(destination)[1]:
                          destination += ".html"
                      elif destination in ("", "."):
                          destination = "index.html"
                  assert Path(destination).is_file(), f"{source_path}: broken local link {href!r} -> {destination}"
                  if target_url.fragment and destination in parsed_pages:
                      fragment = unquote(target_url.fragment)
                      assert fragment in parsed_pages[destination]["ids"], f"{source_path}: missing fragment #{fragment} in {destination}"
                  checked_links += 1
          print(f"LOCAL LINK PASS: {checked_links} links checked across {len(link_pages)} HTML pages")

          canonical_by_page = {}
          for path in pages:
              match = re.search(r'<link rel="canonical" href="([^"]+)"', path.read_text(encoding="utf-8"), re.I)
              assert match, f"{path}: missing canonical URL for sitemap validation"
              canonical_by_page[str(path)] = match.group(1)

          tree = ET.parse("sitemap.xml")
          locs = [node.text for node in tree.getroot().iter() if node.tag.endswith("loc")]
          expected_sitemap_urls = set(canonical_by_page.values())
          assert all(locs), "sitemap contains an empty URL"
          assert len(set(locs)) == len(locs), "duplicate sitemap URLs"
          assert set(locs) == expected_sitemap_urls, f"sitemap URLs do not match page canonicals; missing={expected_sitemap_urls - set(locs)}, extra={set(locs) - expected_sitemap_urls}"
          print(f"SITEMAP PASS: {len(locs)} unique URLs match homepage, about page, and all {len(article_paths)} articles")

          feed_root = ET.parse("feed.xml").getroot()
          assert feed_root.tag == "rss", "feed.xml must have rss root"
          channel = feed_root.find("channel")
          assert channel is not None, "RSS channel missing"
          items = channel.findall("item")
          item_links = [item.findtext("link") for item in items]
          expected_article_urls = {canonical_by_page[str(path)] for path in article_paths}
          assert all(item_links) and len(set(item_links)) == len(item_links), "RSS links missing or duplicated"
          assert set(item_links) == expected_article_urls, f"RSS items do not match all article canonicals; missing={expected_article_urls - set(item_links)}, extra={set(item_links) - expected_article_urls}"
          assert all(item.findtext("title") and item.findtext("description") for item in items), "RSS items require titles and descriptions"
          assert all(item.findtext("guid") for item in items), "RSS items require GUIDs"
          print(f"RSS PASS: {len(items)} unique article items match all {len(article_paths)} article canonicals")
          PY

      - name: Verify deployed files and article routes
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            "https://ai-thuc-chien-blog.manhdungub.workers.dev"
            "https://ai-thuc-chien-blog.pages.dev"
            "https://manhdungub-boop.github.io/ai-thuc-chien-blog"
          )
          files=(
            "index.html" "styles.css" "script.js" "robots.txt" "sitemap.xml" "feed.xml"
            "favicon.svg" "404.html" "ve-chung-toi.html"
          )
          mapfile -t article_files < <(find articles -maxdepth 1 -type f -name '*.html' -print | sort)
          files+=("${article_files[@]}")
          slugs=()
          for article_path in "${article_files[@]}"; do
            slugs+=("$(basename "$article_path" .html)")
          done
          for host in "${hosts[@]}"; do
            echo "Checking ${host}"
            passed=0
            for attempt in 1 2 3 4 5 6; do
              ok=1
              for path in "${files[@]}"; do
                tmp="$(mktemp)"
                if ! curl --fail --silent --show-error --location --max-time 20 "${host}/${path}" -o "$tmp"; then
                  echo "HTTP failure: ${host}/${path}"
                  ok=0
                  rm -f "$tmp"
                  break
                fi
                if ! cmp --silent "$path" "$tmp"; then
                  echo "Content mismatch: ${host}/${path}"
                  ok=0
                  rm -f "$tmp"
                  break
                fi
                rm -f "$tmp"
              done
              if [ "$ok" -eq 1 ]; then
                passed=1
                break
              fi
              echo "Retry ${attempt}/6 after deployment propagation delay"
              sleep 10
            done
            if [ "$passed" -ne 1 ]; then
              echo "FAIL: deployed files do not match the main-branch source at ${host}"
              exit 1
            fi
            echo "PASS: all ${#files[@]} files match at ${host}"

            for slug in "${slugs[@]}"; do
              code="$(curl --silent --show-error --location --max-time 20 -o /dev/null -w "%{http_code}" "${host}/articles/${slug}")"
              if [ "$code" != "200" ]; then
                echo "FAIL: ${host}/articles/${slug} returned HTTP ${code}"
                exit 1
              fi
            done
            about_code="$(curl --silent --show-error --location --max-time 20 -o /dev/null -w "%{http_code}" "${host}/ve-chung-toi")"
            if [ "$about_code" != "200" ]; then
              echo "FAIL: ${host}/ve-chung-toi returned HTTP ${about_code}"
              exit 1
            fi
            feed_code="$(curl --silent --show-error --location --max-time 20 -o /dev/null -w "%{http_code}" "$host/feed.xml")"
            if [ "$feed_code" != "200" ]; then
              echo "FAIL: $host/feed.xml returned HTTP $feed_code"
              exit 1
            fi
            echo "PASS: ${#slugs[@]} article routes, about route, and RSS feed at $host"
          done
