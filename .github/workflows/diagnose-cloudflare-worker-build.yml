name: Diagnose Cloudflare Worker Build

on:
  workflow_dispatch:
    inputs:
      build_uuid:
        description: "UUID from the failed Cloudflare Workers Build details URL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-cloudflare-build-${{ inputs.build_uuid }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate input and token
        shell: bash
        env:
          BUILD_UUID: ${{ inputs.build_uuid }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_UUID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::build_uuid must be a valid UUID."
            exit 1
          fi
          if [[ -z "$CF_API_TOKEN" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_WORKERS_BUILDS_API_TOKEN."
            exit 1
          fi
          echo "::add-mask::$CF_API_TOKEN"

      - name: Fetch build metadata and logs (read-only)
        shell: bash
        env:
          BUILD_UUID: ${{ inputs.build_uuid }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id="92cf091bbac8b4879ec65feb30b4715b"
          api="https://api.cloudflare.com/client/v4/accounts/${account_id}/builds"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_json() {
            local url="$1"
            local out="$2"
            local status
            status="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header 'Accept: application/json' "$url")"
            if [[ "$status" -lt 200 || "$status" -ge 300 ]] || ! jq -e '.success == true' "$out" >/dev/null; then
              echo "::error::Cloudflare API request failed (HTTP $status)."
              jq -r '(.errors[]?.message // empty), (.messages[]? // empty)' "$out" 2>/dev/null || true
              echo "Ensure this is a user-scoped token with Workers CI: Read (or Workers CI: Write) access."
              exit 1
            fi
          }

          fetch_json "${api}/builds/${BUILD_UUID}" "$tmp/build.json"
          echo "## Build metadata"
          jq -r '
            "Build UUID: " + (.result.build_uuid // "unknown"),
            "Outcome: " + (.result.build_outcome // "unknown"),
            "Branch: " + (.result.build_trigger_metadata.branch // "unknown"),
            "Commit: " + (.result.build_trigger_metadata.commit_hash // "unknown"),
            "Build command: " + (.result.build_trigger_metadata.build_command // "unknown"),
            "Deploy command: " + (.result.build_trigger_metadata.deploy_command // "unknown"),
            "Created: " + (.result.created_on // .result.created_at // "unknown"),
            "Updated: " + (.result.modified_on // .result.updated_at // "unknown")
          ' "$tmp/build.json"

          echo
          echo "## Build log (read-only; latest 300 lines)"
          cursor=""
          page=1
          while [[ "$page" -le 6 ]]; do
            url="${api}/builds/${BUILD_UUID}/logs"
            if [[ -n "$cursor" ]]; then
              url="${url}?cursor=${cursor}"
            fi
            fetch_json "$url" "$tmp/logs.json"
            jq -r '.result.lines[]? | if type == "array" then map(tostring) | join(" ") else tostring end' "$tmp/logs.json" \
              | tail -n 300
            cursor="$(jq -r '.result.cursor // empty' "$tmp/logs.json")"
            [[ -z "$cursor" ]] && break
            page=$((page + 1))
          done
          if [[ -n "$cursor" ]]; then
            echo "Additional log pages remain; rerun or inspect build history in the Cloudflare dashboard."
          fi
