name: AI Catalog Official Link Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check catalog official URLs
        run: node scripts/check-ai-tools-links.mjs data/ai-tools.json
