name: Configure Cloudflare Workers Builds
on:
  workflow_dispatch:
    inputs:
      preview_trigger_uuid:
        description: "Optional verified non-production trigger UUID"
        required: false
        type: string
      preview_worker_tag:
        description: "Optional tag returned by the failed preview build"
        required: false
        type: string
      preview_branch:
        description: "Optional exact non-production branch name"
        required: false
        type: string
      preview_commit_sha:
        description: "Optional 40-character commit SHA to queue a preview build after repair"
        required: false
        type: string
      preview_reuse_primary_build_token:
        description: "Opt in to reuse the verified primary Worker build token for this exact preview trigger only"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: configure-cloudflare-workers-builds
  cancel-in-progress: false
jobs:
  configure-triggers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Validate updater logic
        run: python -m unittest discover -s scripts -p 'test_configure_cloudflare_worker_builds.py' -v
      - name: Update verified Workers Builds triggers
        env:
          CLOUDFLARE_WORKERS_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_BUILDS_API_TOKEN }}
          PREVIEW_TRIGGER_UUID: ${{ inputs.preview_trigger_uuid }}
          PREVIEW_WORKER_TAG: ${{ inputs.preview_worker_tag }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
          PREVIEW_COMMIT_SHA: ${{ inputs.preview_commit_sha }}
          PREVIEW_REUSE_PRIMARY_BUILD_TOKEN: ${{ inputs.preview_reuse_primary_build_token }}
        run: python scripts/configure_cloudflare_worker_builds.py
