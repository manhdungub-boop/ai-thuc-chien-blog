<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Đặt giới hạn quota cho AI Agent</title>
<desc id="desc">Infographic nguyên bản mô tả ba lớp bảo vệ: phân loại rate limit và quota, đặt hard limit cho lượt gọi và token, dừng hoặc retry có kiểm soát.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#14243b"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#55d6b5"/><stop offset="1" stop-color="#8ab4ff"/></linearGradient></defs>
<rect width="1200" height="630" rx="32" fill="url(#bg)"/>
<text x="72" y="92" fill="#73dfc2" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">AI THỰC CHIẾN · DUNG - AI</text>
<text x="72" y="166" fill="#eef4ff" font-family="Arial,sans-serif" font-size="48" font-weight="800">Đặt giới hạn quota</text>
<text x="72" y="224" fill="#eef4ff" font-family="Arial,sans-serif" font-size="48" font-weight="800">cho AI Agent</text>
<text x="74" y="270" fill="#b7c4d8" font-family="Arial,sans-serif" font-size="24">Hard-stop · Ngân sách · Circuit breaker</text>
<g font-family="Arial,sans-serif">
<rect x="72" y="342" width="318" height="174" rx="22" fill="#14243b" stroke="#36506f" stroke-width="2"/>
<circle cx="118" cy="390" r="24" fill="url(#accent)"/><text x="118" y="398" fill="#081421" font-size="23" text-anchor="middle" font-weight="800">1</text>
<text x="158" y="390" fill="#eef4ff" font-size="23" font-weight="700">Phân loại</text>
<text x="102" y="445" fill="#b7c4d8" font-size="20">Rate limit · Quota</text>
<text x="102" y="477" fill="#b7c4d8" font-size="20">Budget · Concurrency</text>
<path d="M402 429 H438 M426 417 L440 429 L426 441" stroke="#68d8bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="450" y="342" width="318" height="174" rx="22" fill="#14243b" stroke="#36506f" stroke-width="2"/>
<circle cx="496" cy="390" r="24" fill="url(#accent)"/><text x="496" y="398" fill="#081421" font-size="23" text-anchor="middle" font-weight="800">2</text>
<text x="536" y="390" fill="#eef4ff" font-size="23" font-weight="700">Hard limit</text>
<text x="480" y="445" fill="#b7c4d8" font-size="20">Lượt gọi · Token</text>
<text x="480" y="477" fill="#b7c4d8" font-size="20">Số bước · Thời gian</text>
<path d="M780 429 H816 M804 417 L818 429 L804 441" stroke="#68d8bd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="828" y="342" width="300" height="174" rx="22" fill="#14243b" stroke="#36506f" stroke-width="2"/>
<circle cx="874" cy="390" r="24" fill="url(#accent)"/><text x="874" y="398" fill="#081421" font-size="23" text-anchor="middle" font-weight="800">3</text>
<text x="914" y="390" fill="#eef4ff" font-size="23" font-weight="700">Dừng an toàn</text>
<text x="858" y="445" fill="#b7c4d8" font-size="20">Retry có giới hạn</text>
<text x="858" y="477" fill="#b7c4d8" font-size="20">Chờ hoặc duyệt</text>
</g>
<text x="72" y="576" fill="#8ea1bb" font-family="Arial,sans-serif" font-size="18">Ví dụ thiết kế · Không phải quota cố định của nhà cung cấp</text>
</svg>