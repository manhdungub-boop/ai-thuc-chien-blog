name: Isolated Preview email relay E2E

on:
  push:
    branches:
      - security/pin-verified-actions-20261110
    paths:
      - "scripts/run-preview-email-relay-e2e.mjs"
      - ".github/workflows/preview-email-relay-e2e.yml"

permissions:
  contents: read

concurrency:
  group: isolated-preview-email-relay-e2e
  cancel-in-progress: false

jobs:
  send-test-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persisting the GitHub token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Send one verification message through isolated Preview
        env:
          PREVIEW_BASE_URL: https://ai-thuc-chien-blog-auth-app-preview.manhdungub.workers.dev
          TEST_EMAIL: daingo11+ai-thuc-chien-${{ github.run_id }}@gmail.com
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/run-preview-email-relay-e2e.mjs
