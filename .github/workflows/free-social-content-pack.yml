name: Free Facebook content draft

on:
  schedule:
    # 09:00 Asia/Ho_Chi_Minh every Wednesday
    - cron: "0 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-facebook-content-draft
  cancel-in-progress: false

jobs:
  build-facebook-draft:
    # Drafts are generated only from the public main branch, never from PR/Preview RSS.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check script syntax and deterministic self-test
        run: |
          node --check scripts/generate-social-content-pack.mjs
          node scripts/generate-social-content-pack.mjs --self-test

      - name: Generate Facebook draft from published RSS entries
        run: |
          node scripts/generate-social-content-pack.mjs --feed feed.xml --out reports/social/facebook-content-draft.md

      - name: Add Facebook draft summary to workflow run
        run: |
          {
            echo "## Free Facebook content draft"
            echo
            echo "- Source: repository RSS only"
            echo "- Output: five newest published articles, or fewer if RSS contains fewer entries"
            echo "- Destination: Facebook Page draft copy only"
            echo "- No social publishing, account mutation, external API, paid service, or secret access"
            echo
            cat reports/social/facebook-content-draft.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Facebook draft
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: free-facebook-content-draft-${{ github.run_id }}
          path: reports/social/facebook-content-draft.md
          if-no-files-found: error
          retention-days: 14
