name: Generate and Verify Agent Runtime Lockfile

on:
  push:
    branches:
      - fix/runtime-lockfile-generation-20261120
  pull_request:
    branches:
      - fix/runtime-lockfile-generation-20261120
    paths:
      - ".github/workflows/agent-runtime-lockfile-generation.yml"
      - "agents/runtime/package.json"
      - "agents/runtime/package-lock.json"
      - "agents/runtime/tests/**"

# This workflow only validates a reproducible lockfile. It never writes to GitHub.
permissions:
  contents: read

concurrency:
  group: agent-runtime-lockfile-generation
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out isolated lockfile branch without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Pin npm toolchain
        run: |
          set -euo pipefail
          npm install --global npm@10.9.4 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.4"
          node --version
          npm --version

      - name: Generate lockfile from the declared dependency graph
        working-directory: agents/runtime
        run: |
          set -euo pipefail
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Verify clean reproducible installation
        working-directory: agents/runtime
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run verify-direct-dependencies
          npm test
          node --test tests/runtime-contract.test.mjs

      - name: Verify generated lockfile is the committed lockfile
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- agents/runtime/package-lock.json; then
            echo "::error::Generated lockfile differs from the committed lockfile. Regenerate and submit the lockfile in a reviewed commit."
            git diff --stat -- agents/runtime/package-lock.json
            exit 1
          fi
          echo "Committed lockfile is reproducible and matches the declared dependency graph."

      - name: Report safety boundary
        if: always()
        run: |
          {
            echo "## Agent Runtime lockfile validation"
            echo "- GitHub token permission: contents: read only"
            echo "- Checkout credentials are not persisted"
            echo "- npm lifecycle scripts are disabled"
            echo "- Lockfile generation and reproducible install are validated"
            echo "- Workflow does not commit or push repository changes"
            echo "- No Cloudflare credentials, deployment, OAuth, Cron, AI inference, publication, Production Worker, D1, or DNS access"
          } >> "$GITHUB_STEP_SUMMARY"
