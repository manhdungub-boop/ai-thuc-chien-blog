            [[ "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            EXPECTED_SHA="$EXPECTED_SHA" EXPECTED_PR_NUMBER="$EXPECTED_PR_NUMBER" GITHUB_TOKEN="$GITHUB_TOKEN" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const repository = 'manhdungub-boop/ai-thuc-chien-blog';
          const number = process.env.EXPECTED_PR_NUMBER;
          const response = await fetch('https://api.github.com/repos/' + repository + '/pulls/' + number, {
