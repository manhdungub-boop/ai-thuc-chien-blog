name: Production Worker-only deployment disabled by project policy

on:
  workflow_dispatch:
    inputs:
      acknowledge_disabled:
        description: "This workflow is disabled for the current release scope; no Production Worker or D1 operation will run."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: echo "Disabled by project policy. No Production Worker or D1 action is permitted in this release."
