name: Legacy Cloudflare Branch Preview Trigger Repair (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why the legacy repair is disabled
        run: |
          echo "::notice::This legacy workflow is disabled because its hard-coded Worker tags, trigger UUIDs and commit SHA no longer match the current Cloudflare inventory."
          echo "::notice::Use Configure Cloudflare Workers Builds only with an exact, verified non-production Preview trigger."
          echo "No Cloudflare API calls, token creation, trigger updates, builds or deployments are performed."
