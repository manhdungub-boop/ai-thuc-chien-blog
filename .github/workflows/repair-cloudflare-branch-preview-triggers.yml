name: Legacy Cloudflare Branch Preview Trigger Repair (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy trigger mutation
        run: |
          echo "::error::Disabled: legacy trigger repair has unverified Worker identity and must not receive Cloudflare credentials."
          echo "Use the offline-only Workers Builds validation workflow. Do not recreate or mutate build tokens/triggers here."
          exit 1
