          assert.equal(response.status, 200, 'GitHub must return the requested PR');
          const pr = await response.json();
          assert.equal(pr.state, 'open', 'target PR must remain open');
          assert.equal(pr.head?.repo?.full_name, repository, 'fork PR heads are not eligible');
          assert.equal(pr.base?.repo?.full_name, repository, 'PR base must belong to this repository');
          const allowedBaseRefs = new Set(['main', 'integration/agent-runtime-v5-preview-20261120', 'fix/ai-bank-discovery-ingestion-gate-20261127']);
