name: AI Bank read-only discovery

on:
  # Manual-only until durable cross-run cursor persistence, deduplication and quality gates are verified.
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Discovery window (1-90 days, bounded by the saved From now on cursor)"
        required: false
        default: "90"

permissions:
  contents: read

concurrency:
  group: ai-bank-readonly-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      # User-selected RSS boundary: From now on (2026-11-22 03:04:52 UTC).
      AI_BANK_DISCOVERY_START_AT: "2026-11-22T03:04:52Z"
    timeout-minutes: 10
    steps:
      - name: Check out exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Collect official release discovery signals
        env:
          AI_BANK_DISCOVERY_DAYS: ${{ inputs.lookback_days || '90' }}
        run: node scripts/run-ai-bank-readonly-discovery.mjs

      - name: Add safe interpretation to workflow summary
        if: always()
        run: |
          {
            echo "## AI Bank discovery — read only"
            echo
            echo "- Revision: $GITHUB_SHA"
            echo "- Start cursor: $AI_BANK_DISCOVERY_START_AT (From now on; earlier releases are excluded)."
            echo "- Trigger: manual only; scheduled collection remains disabled until cross-run deduplication and quality gates are verified."
            echo "- Collector: shared Agent Runtime allowlist and bounded Atom parser."
            echo "- Signals are candidates for editorial investigation, not verified tools."
            echo "- No catalog, article, Worker, DNS, D1, secrets, or Production setting is modified."
            echo
            if [[ -f reports/ai-bank/discovery-signals.json ]]; then
              node -e "const r=require('./reports/ai-bank/discovery-signals.json'); console.log('- Sources: '+r.sources_succeeded+'/'+r.sources_checked+' successful'); console.log('- Recent release signals: '+r.signal_count); console.log('- Candidate summaries: '+r.catalog_candidates.length); console.log('- Failed feeds: '+r.sources_failed.length);"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve read-only discovery report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-bank-discovery-${{ github.run_id }}
          path: reports/ai-bank/discovery-signals.json
          if-no-files-found: warn
          retention-days: 30
