name: Verify Website Health

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Cloudflare Pages", "Deploy Cloudflare Workers"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js for browser-script regression tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate static assets
        run: npm run build

      - name: Check worker runtime and test security headers
        run: |
          node --check script.js
          node --check worker.mjs
          node scripts/test_worker_headers.mjs
          node scripts/test_homepage_search.cjs

      - name: Test article content quality
        run: npm run test:content

      - name: Test copy-to-clipboard interactions
        run: node scripts/test_copy_prompt.cjs

      - name: Test contextual article navigation
        run: node scripts/test_article_navigation.cjs

      - name: Test homepage discovery for every published article
        run: node scripts/test_homepage_article_coverage.cjs

      - name: Smoke-test live Workers and Pages deployments
        shell: bash
        run: |
          set -euo pipefail
          hosts=(
            "https://ai-thuc-chien-blog.manhdungub.workers.dev"
            "https://ai-thuc-chien-blog.pages.dev"
          )
          paths=(
            "/"
            "/articles/do-luong-hieu-qua-blog"
            "/sitemap.xml"
            "/feed.xml"
            "/google4e45ddcf8facb122.html"
          )
          for host in "${hosts[@]}"; do
            echo "Checking live host: $host"
            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "$headers" "$body"' EXIT
            curl --fail --silent --show-error --location --max-time 25 -D "$headers" -o "$body" "$host/"
            for expected in \
              'X-Content-Type-Options: nosniff' \
              'X-Frame-Options: DENY' \
              'Referrer-Policy: strict-origin-when-cross-origin'; do
              if ! grep -Fqi "$expected" "$headers"; then
                echo "FAIL: $host is missing security header: $expected"
                cat "$headers"
                exit 1
              fi
            done
            for path in "${paths[@]:1}"; do
              code="$(curl --silent --show-error --location --max-time 25 -o /dev/null -w "%{http_code}" "$host$path")"
              if [ "$code" != "200" ]; then
                echo "FAIL: $host$path returned HTTP $code"
                exit 1
              fi
              echo "PASS: $host$path returned HTTP 200"
            done
            rm -f "$headers" "$body"
            trap - EXIT
          done
          echo "LIVE SMOKE TEST PASS: both production hosts and key routes responded successfully."
